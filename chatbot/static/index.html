<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>다올 리서치 톤 챗봇</title>
  <style>
    :root { --bg:#f6f4ef; --panel:#fff; --ink:#1d1d1f; --sub:#6b6b70; --accent:#0f4c81; --user:#0f4c81; }
    * { box-sizing:border-box; margin:0; }
    body { font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--bg); color:var(--ink);
           display:flex; flex-direction:column; height:100vh; max-width:820px; margin:0 auto; }
    header { padding:16px 20px 10px; }
    header h1 { font-size:18px; }
    header p { font-size:12px; color:var(--sub); margin-top:4px; }
    #chat { flex:1; overflow-y:auto; padding:10px 20px; display:flex; flex-direction:column; gap:10px; }
    .msg { max-width:85%; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.6; white-space:pre-wrap; }
    .msg.user { align-self:flex-end; background:var(--user); color:#fff; border-bottom-right-radius:4px; }
    .msg.assistant { align-self:flex-start; background:var(--panel); border:1px solid #e5e2da; border-bottom-left-radius:4px; }
    .msg.error { align-self:flex-start; background:#fdeaea; border:1px solid #f2c3c3; color:#8a1f1f; }
    .msg.pending { color:var(--sub); font-style:italic; }
    form { display:flex; gap:8px; padding:12px 20px 18px; }
    input { flex:1; padding:12px 14px; border:1px solid #d8d4cb; border-radius:10px; font-size:14px; background:var(--panel); }
    input:focus { outline:2px solid var(--accent); border-color:transparent; }
    button { padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .hints { display:flex; flex-wrap:wrap; gap:6px; padding:0 20px 6px; }
    .hints button { background:var(--panel); color:var(--accent); border:1px solid #d8d4cb; font-size:12px; padding:6px 10px; }
  </style>
</head>
<body>
  <header>
    <h1>다올 리서치 톤 챗봇</h1>
    <p>다올리서치 리포트 1,200여 건 구조화 데이터 + PDF 원문 기반 · 데이터에 없는 값은 답하지 않습니다</p>
  </header>
  <div id="chat"></div>
  <div class="hints">
    <button type="button">오늘 뭐 바뀌었어?</button>
    <button type="button">최광식 조선 톤 요즘 어때?</button>
    <button type="button">삼양식품 다올 뷰?</button>
    <button type="button">HBM 언급한 리포트 찾아줘</button>
  </div>
  <form id="form">
    <input id="input" placeholder="질문을 입력하세요" autocomplete="off" autofocus>
    <button id="send" type="submit">전송</button>
  </form>
  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const history = [];

    function bubble(role, text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + (cls || role);
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function ask(question) {
      bubble('user', question);
      history.push({ role: 'user', content: question });
      input.value = '';
      send.disabled = true;
      const pending = bubble('assistant', '데이터 조회 중…', 'assistant pending');
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        pending.remove();
        if (!res.ok || data.error) {
          bubble('assistant', data.error || '오류가 발생했습니다.', 'error');
          history.pop(); // 실패한 턴은 이력에서 제거
        } else {
          bubble('assistant', data.reply);
          history.push({ role: 'assistant', content: data.reply });
        }
      } catch (e) {
        pending.remove();
        bubble('assistant', '서버에 연결하지 못했습니다.', 'error');
        history.pop();
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (q && !send.disabled) ask(q);
    });
    document.querySelectorAll('.hints button').forEach((b) =>
      b.addEventListener('click', () => { if (!send.disabled) ask(b.textContent); }));
  </script>
</body>
</html>
