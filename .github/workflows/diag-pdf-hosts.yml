name: 진단 — PDF 호스트 연결성 (일회용)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: attach_file 컨텍스트 + common.jspx 전문
        run: |
          python3 - <<'EOF'
          import re, requests
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36'}
          s=requests.Session(); s.headers.update(UA)
          BASE='https://www.daolsecurities.com'
          r=s.get(BASE+'/research/main.jspx', timeout=15); html=r.text
          print('== main.jspx', r.status_code, len(html))
          pos=[m.start() for m in re.finditer(r'attach_file', html)][:4]
          for p in pos:
              print('CTX:', re.sub(r'\s+',' ',html[max(0,p-420):p+200])[:660])
              print('---')
          r2=s.get(BASE+'/research/article/common.jspx?rGubun=RALL', timeout=15)
          print('== common.jspx FULL'); print(re.sub(r'\n{2,}','\n',r2.text))
          EOF
