name: 진단 — PDF 호스트 연결성 (일회용)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 목록 AJAX 행 포맷 + PDF 실다운로드 검증
        run: |
          python3 - <<'EOF'
          import re, requests
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36'}
          s=requests.Session(); s.headers.update(UA)
          BASE='https://www.daolsecurities.com'
          s.get(BASE+'/research/article/common.jspx?rGubun=RALL', timeout=15)
          r=s.post(BASE+'/research/article/common.jspx?cmd=list&templet-bypass=true',
                   data={'curPage':'1','rGubun':'RALL','sctrGubun':'','web':'','hts':'','bbSeq':'',
                         'filepath':'','attaFileNm':'','startDate':'2026/09/25','endDate':'2026/10/04',
                         'searchSelect':'0','searchNm1':'','searchNm2':'M01'},
                   headers={'Referer':BASE+'/research/article/common.jspx?rGubun=RALL',
                            'X-Requested-With':'XMLHttpRequest'}, timeout=20)
          print('== list status', r.status_code, 'len', len(r.text), 'totCount hdr:', r.headers.get('totCount'))
          body=re.sub(r'\s+',' ',r.text)
          print('BODY[:3200]:', body[:3200])
          # PDF 직링크 검증: 응답에서 첫 attach 경로/파일명 추출
          m=re.search(r"fn_viewPdfPopEvt\('([^']+)','([^']+)'\)", r.text) or re.search(r"fn_download_before\('([^']+)','([^']+)'", r.text)
          if m:
              path, fn = m.group(1), m.group(2)
              u=f"{BASE}/common/download.jspx?cmd=viewPDF&path={path}/{fn}"
              rr=s.get(u, headers={'Referer':BASE+'/research/article/common.jspx?rGubun=RALL'}, timeout=30)
              print('== PDF:', u[:150], '->', rr.status_code, len(rr.content), rr.content[:8])
          EOF
