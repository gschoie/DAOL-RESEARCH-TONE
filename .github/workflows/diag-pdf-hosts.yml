name: 진단 — PDF 호스트 연결성 (일회용)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 리서치 게시판 행 구조·목록·실다운로드 검증
        run: |
          python3 - <<'EOF'
          import re, requests
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36'}
          s=requests.Session(); s.headers.update(UA)
          BASE='https://www.daolsecurities.com'
          r=s.get(BASE+'/research/main.jspx', timeout=15)
          html=r.text
          print('== main.jspx', r.status_code, len(html))
          # 1) download.jspx 전체 href
          for m in sorted(set(re.findall(r'''["']([^"']*download\.jspx[^"']*)["']''', html))):
              print('DL:', m[:200])
          # 2) 행 구조: 제목/날짜가 어떻게 붙는지 — download 링크 주변 300자
          for m in list(re.finditer(r'download\.jspx', html))[:3]:
              seg=re.sub(r'\s+',' ',html[max(0,m.start()-500):m.start()+260])
              print('ROW:', seg[-640:])
          # 3) 목록/상세 페이지 후보 링크
          for m in sorted(set(re.findall(r'''["']((?:/research/|researchView|researchList|research_)[^"']{0,120})["']''', html))):
              print('NAV:', m[:160])
          # 4) 최신 attach 하나 실제 다운로드 (전체 경로를 페이지에서 그대로)
          dl=re.search(r'''["']([^"']*download\.jspx[^"']*attach_file/RESEARCH[^"']*)["']''', html)
          if dl:
              u=dl.group(1).replace('&amp;','&')
              if u.startswith('/'): u=BASE+u
              rr=s.get(u, headers={'Referer':BASE+'/research/main.jspx'}, timeout=30)
              print('== 실다운로드:', rr.status_code, len(rr.content), rr.content[:20])
          EOF
