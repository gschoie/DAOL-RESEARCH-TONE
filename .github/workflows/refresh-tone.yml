name: 톤 수집·AI 분석·배포

# 다올리서치 채널 수집 → AI 톤 분석(증분) → v2 빌드 → 콜라보 레이더 → Pages 배포.
# 데이터는 캐시가 아니라 리포에 커밋백한다(대시보드 리포에서 겪은 캐시 계보 꼬임 원천 차단).
on:
  workflow_dispatch:
  # 코드 push 시에도 전체 파이프라인 실행(봇 커밋백은 GITHUB_TOKEN이라 재트리거 안 됨 — 무한루프 없음).
  push:
    branches: ["main"]
  schedule:
    # 아침 런(KST 07:45): 그날 아침 7:00~7:45 발간분을 신규 위주로 빠르게 처리 → 8시 전 배포 목표.
    - cron: "45 22 * * *"
    # 아침 2차 스윕(KST 08:20): GitHub 크론 지연·7:45 이후 발간분 커버(신규 없으면 수 분 내 종료).
    - cron: "20 23 * * *"
    # 저녁 런(KST 22:00): 과거 리포트 AI 백필 전용(200건) — 백필 완료 후엔 사실상 노옵.
    - cron: "0 13 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tone-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python 패키지 준비
        run: python -m pip install requests beautifulsoup4 lxml pypdf pypdfium2

      - name: 텔레그램 수집 + 정규식 1차 추출
        run: python build_daol_tone_dashboard.py --refresh

      # 리포트 1건당 LLM 구조화 분석. 캐시(daol_ai_analysis.json)에 누적 — 재호출 없음.
      # 하루 1회 스케줄이라 런당 200건(약 22분) — 백필 완료 후엔 하루 신규분만 처리돼 수 분.
      # 키가 없거나 일일 쿼터 소진 시 우아하게 멈춘다(정규식 데이터만으로 사이트 정상 동작).
      # 이 키로 호출 가능한 모델 목록을 커밋백 데이터로 남긴다(모델 개편 시 진단용).
      # 타사 리서치(한경 에이셀) 증분 수집 — 실패해도 파이프라인 계속(스트리트 패널만 옛 데이터)
      - name: 한경 에이셀 수집
        run: python ked_street_collector.py || echo "::warning::에이셀 수집 실패"

      # 이벤트 사후 주가 검증용 종가 캐시(실패해도 파이프라인 계속 — 수익률 칩만 비게 됨)
      - name: 주가 종가 캐시 갱신
        run: python price_returns.py || echo "::warning::주가 캐시 갱신 실패"

      - name: 사용 가능 Gemini 모델 덤프
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'EOF'
          import json, os, urllib.request
          key = os.environ.get('GEMINI_API_KEY', '').strip()
          names = []
          if key:
              try:
                  d = json.load(urllib.request.urlopen(
                      f'https://generativelanguage.googleapis.com/v1beta/models?key={key}&pageSize=100', timeout=30))
                  names = sorted(m['name'] for m in d.get('models', [])
                                 if 'generateContent' in m.get('supportedGenerationMethods', []))
              except Exception as exc:
                  names = [f'error: {type(exc).__name__}: {exc}'[:300]]
          open('data/ai_models.json', 'w', encoding='utf-8').write(json.dumps(names, indent=1))
          EOF

      - name: AI 톤 분석 (증분)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 아침 런들은 신규만 빠르게(15건, ~2분), 저녁 런·수동 실행은 백필 몫(200건, ~22분).
          AI_MAX_REPORTS: ${{ (github.event.schedule == '45 22 * * *' || github.event.schedule == '20 23 * * *') && '15' || '200' }}
          AI_BUDGET_SECONDS: "1800"
        run: python ai_report_analyzer.py

      - name: 톤 v2 빌드 (타임라인·이벤트·요약)
        run: python build_daol_tone_v2.py

      - name: 섹터 콜라보 레이더
        run: python build_daol_collab_radar.py

      - name: 배포 사이트 조립
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp site/daol_collab_radar.html _site/ 2>/dev/null || true
          cp data/daol_tone_v2.json data/tone_summary.json data/daol_tone_history.json data/ked_street.json _site/

      # 커밋백이 실패해도 배포는 계속한다(데이터는 다음 성공 런에 다시 담김).
      # 실패 시 진단을 _site/debug_commitback.txt로 배포해 밖에서 원인을 볼 수 있게 한다.
      - name: 데이터 커밋백
        run: |
          set +e
          (
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ site/daol_collab_radar.html
            git diff --cached --quiet || git commit -m "chore(data): 톤 데이터 갱신 $(TZ=Asia/Seoul date +%F)"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && exit 0
              echo "--- push attempt $attempt failed, retrying ---"
              sleep 5
            done
            exit 1
          ) > commitback.log 2>&1
          rc=$?
          cat commitback.log
          if [ $rc -ne 0 ]; then
            echo "::warning::데이터 커밋백 실패 — 배포는 계속, 진단은 debug_commitback.txt"
            { date -u; git status; echo ---; tail -60 commitback.log; } > _site/debug_commitback.txt 2>&1
          fi

      - name: 배포 안전망 검사
        run: |
          python - <<'EOF'
          import json, sys
          d = json.load(open('_site/daol_tone_v2.json', encoding='utf-8'))
          count = int(d.get('report_count') or 0)
          if count < 500:
              print(f"::error::tone v2 report_count dropped to {count}; minimum is 500")
              sys.exit(1)
          print(f"safety ok: {count} reports, ai {d.get('ai_analyzed')}")
          EOF

      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
