<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다올 리서치 톤 챗봇</title>
<style>
  :root { --bg:#f6f4ef; --panel:#fff; --ink:#1d1d1f; --sub:#6b6b70; --accent:#0f4c81; --user:#0f4c81; --line:#d8d4cb; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--bg); color:var(--ink);
         display:flex; flex-direction:column; height:100vh; height:100dvh; max-width:820px; margin:0 auto; }
  header { padding:14px 20px 8px; display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
  header h1 { font-size:17px; }
  header .home { font-size:12px; color:var(--accent); text-decoration:none; }
  header .home:hover { text-decoration:underline; }
  #settings { display:flex; gap:6px; padding:0 20px 8px; align-items:center; flex-wrap:wrap; font-size:12px; }
  #settings input { flex:1; min-width:180px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:12px; background:var(--panel); }
  #settings select, #settings button { padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:12px; background:var(--panel); color:var(--ink); cursor:pointer; }
  #settings button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  #keyhint { font-size:11px; color:var(--sub); padding:0 20px 6px; }
  #keyhint a { color:var(--accent); }
  #setup { padding:0 20px 4px; }
  #setup > summary { cursor:pointer; font-size:12px; color:var(--sub); padding:2px 0 6px; list-style:none; }
  #setup > summary::before { content:'▸ '; }
  #setup[open] > summary::before { content:'▾ '; }
  #setup #settings, #setup #keyhint { padding-left:0; padding-right:0; }
  #pastlog { margin:2px 0 4px; max-width:100%; }
  #pastlog > summary { cursor:pointer; font-size:12px; color:var(--sub); padding:4px 0; list-style:none; }
  #pastlog > summary::before { content:'▸ '; }
  #pastlog[open] > summary::before { content:'▾ '; }
  #pastlog-body { display:flex; flex-direction:column; gap:8px; padding:4px 0 6px; opacity:.85; }
  #pastlog-body .msg { font-size:13px; }
  #clearlog { align-self:flex-start; background:var(--panel); color:var(--sub); border:1px solid var(--line); font-size:11px; padding:4px 8px; border-radius:8px; cursor:pointer; }
  #chat { flex:1; overflow-y:auto; padding:8px 20px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.65; white-space:pre-wrap; word-break:break-word; }
  .msg.md { white-space:normal; }
  .msg.md p { margin:5px 0; }
  .msg.md ul, .msg.md ol { margin:5px 0; padding-left:20px; }
  .msg.md li { margin:3px 0; }
  .msg.md h3, .msg.md h4, .msg.md h5 { margin:10px 0 4px; }
  .msg.md h3 { font-size:15px; } .msg.md h4, .msg.md h5 { font-size:14px; }
  .msg.md code { background:#f0ede6; padding:1px 4px; border-radius:4px; font-size:12.5px; }
  .msg.md hr { border:0; border-top:1px solid #e5e2da; margin:8px 0; }
  .msg.md a { color:var(--accent); }
  .msg.chart { white-space:normal; width:min(420px, 88%); }
  .chart-title { font-size:12.5px; font-weight:600; margin-bottom:4px; }
  .chart-cap { font-size:11px; color:var(--sub); margin-top:2px; }
  .msg.chart svg { width:100%; height:auto; display:block; }
  #brief { margin:2px 0 4px; }
  #brief > summary { cursor:pointer; font-size:12px; color:var(--sub); padding:4px 0; list-style:none; }
  #brief > summary::before { content:'▸ '; }
  #brief[open] > summary::before { content:'▾ '; }
  #brief .msg { max-width:100%; }
  .funda { margin-top:10px; overflow-x:auto; }
  .funda table { border-collapse:collapse; width:100%; font-size:12px; font-variant-numeric:tabular-nums; }
  .funda th, .funda td { padding:2px 8px; text-align:right; white-space:nowrap; }
  .funda th:first-child, .funda td:first-child { text-align:left; }
  .funda th { color:var(--sub); font-weight:600; border-bottom:1.5px solid var(--line); }
  .msg.user { align-self:flex-end; background:var(--user); color:#fff; border-bottom-right-radius:4px; }
  .msg.assistant { align-self:flex-start; background:var(--panel); border:1px solid #e5e2da; border-bottom-left-radius:4px; }
  .msg.error { align-self:flex-start; background:#fdeaea; border:1px solid #f2c3c3; color:#8a1f1f; }
  .msg.status { align-self:flex-start; background:transparent; border:0; color:var(--sub); font-size:12px; font-style:italic; padding:0 4px; }
  .hints { display:flex; flex-wrap:wrap; gap:6px; padding:0 20px 6px; }
  .hints button { background:var(--panel); color:var(--accent); border:1px solid var(--line); font-size:12px; padding:6px 10px; border-radius:8px; cursor:pointer; }
  form { display:flex; gap:8px; padding:10px 20px 16px; }
  #input { flex:1; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:var(--panel); }
  #input:focus { outline:2px solid var(--accent); border-color:transparent; }
  #send { padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; }
  #send:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>
  <h1>다올 리서치 톤 챗봇</h1>
  <a class="home" href="./index.html">← 톤 보드</a>
</header>
<details id="setup">
  <summary>⚙️ 설정 — 모델·API 키</summary>
  <div id="settings">
    <input id="apikey" type="password" placeholder="API 키 — 이 브라우저에만 저장됩니다" autocomplete="off">
    <select id="model">
      <option value="gemini-flash-lite-latest">Gemini Flash-Lite (무료·기본)</option>
      <option value="gemini-flash-latest">Gemini Flash (무료·품질↑ 한도↓)</option>
      <option value="claude-opus-5">Claude Opus 5 (유료·최고품질)</option>
      <option value="claude-sonnet-5">Claude Sonnet 5 (유료·절약)</option>
      <option value="claude-haiku-4-5">Claude Haiku 4.5 (유료·최저가)</option>
    </select>
    <button id="savekey" class="primary" type="button">저장</button>
    <button id="clearkey" type="button">키 삭제</button>
  </div>
  <div id="keyhint">Gemini 무료 키: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> (카드 불필요) · Claude 키: <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a> · 서버 없이 브라우저에서 직접 호출</div>
</details>
<div id="chat"></div>
<div class="hints">
  <button type="button">오늘 뭐 바뀌었어?</button>
  <button type="button">최광식 조선 톤 요즘 어때?</button>
  <button type="button">삼양식품 다올 뷰?</button>
  <button type="button">HBM 언급한 리포트 찾아줘</button>
  <button type="button">다올이 시장보다 강하게 보는 종목은?</button>
</div>
<form id="form">
  <input id="input" placeholder="질문을 입력하세요" autocomplete="off" autofocus>
  <button id="send" type="submit">전송</button>
</form>

<script>
'use strict';
/* ============ 설정 (localStorage) ============ */
const $ = (id) => document.getElementById(id);
const LS_MODEL = 'daol_chat_model';
// 공급자별 키를 따로 저장한다 — Gemini(무료)와 Claude(유료)를 오가며 쓸 수 있게.
const PROVIDERS = {
  gemini:    { ls: 'daol_chat_gemini_key',
               placeholder: 'Gemini API 키 (AIza…) — aistudio.google.com/apikey 무료 발급' },
  anthropic: { ls: 'daol_chat_api_key',
               placeholder: 'Anthropic API 키 (sk-ant-…) — console.anthropic.com 발급' },
};
const providerOf = (model) => model.startsWith('gemini') ? 'gemini' : 'anthropic';
const currentProvider = () => providerOf($('model').value);
function syncKeyInput() {
  const p = PROVIDERS[currentProvider()];
  $('apikey').placeholder = p.placeholder;
  $('apikey').value = localStorage.getItem(p.ls) || '';
}
// 베타테스트 비밀 링크: chat.html#k=AIza... 로 열면 Gemini 키를 저장하고 주소에서 즉시 지운다.
// 키는 코드·리포에 없고 링크에만 있으므로, 링크는 사내 메신저 등 닫힌 채널로만 공유할 것.
let keyImported = false;
(function importKeyFromHash() {
  const m = location.hash.match(/[#&]k=([^&]+)/);
  if (!m) return;
  try {
    localStorage.setItem(PROVIDERS.gemini.ls, decodeURIComponent(m[1]).trim());
    localStorage.setItem(LS_MODEL, localStorage.getItem(LS_MODEL) || 'gemini-flash-lite-latest');
    keyImported = true;
  } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search);
})();
$('model').value = localStorage.getItem(LS_MODEL) || 'gemini-flash-lite-latest';
syncKeyInput();
// 키가 이미 저장돼 있으면 설정을 접어둔다 — 필요할 때 ⚙️로 다시 연다.
$('setup').open = !($('apikey').value || '').trim();
$('savekey').onclick = () => { localStorage.setItem(PROVIDERS[currentProvider()].ls, $('apikey').value.trim()); localStorage.setItem(LS_MODEL, $('model').value); $('setup').open = false; bubble('status', '저장했습니다. 이제 질문해 보세요.'); };
$('model').onchange = () => { localStorage.setItem(LS_MODEL, $('model').value); geminiSticky = null; syncKeyInput(); if (!($('apikey').value || '').trim()) $('setup').open = true; };
$('clearkey').onclick = () => { localStorage.removeItem(PROVIDERS[currentProvider()].ls); $('apikey').value = ''; bubble('status', '현재 공급자의 키를 삭제했습니다.'); };

/* ============ 대화 로그 (localStorage 보존) ============ */
const LS_LOG = 'daol_chat_log', MAX_LOG = 200;
function loadLog() { try { return JSON.parse(localStorage.getItem(LS_LOG)) || []; } catch (e) { return []; } }
function saveTurn(role, text) {
  const log = loadLog();
  log.push({ role, text, ts: Date.now() });
  while (log.length > MAX_LOG) log.shift();
  try { localStorage.setItem(LS_LOG, JSON.stringify(log)); } catch (e) { /* 저장공간 초과 시 로그 없이 진행 */ }
}

/* ============ 데이터 로더 (같은 사이트의 JSON, 메모리 캐시) ============ */
const dataCache = new Map();
function loadJson(name, label) {
  if (!dataCache.has(name)) {
    dataCache.set(name, (async () => {
      const note = label ? bubble('status', `${label} 로딩 중…`) : null;
      try {
        const res = await fetch('./' + name, { cache: 'no-cache' });
        if (!res.ok) throw new Error(`${name} HTTP ${res.status}`);
        return await res.json();
      } finally { if (note) note.remove(); }
    })().catch(err => { dataCache.delete(name); throw err; }));
  }
  return dataCache.get(name);
}

/* ============ 조회 로직 (chatbot/tools.py·fulltext.py 포팅) ============ */
const MAX_TIMELINE = 12, MAX_STREET = 20, MAX_REPORTS = 10, MAX_RESULT_CHARS = 12000;
const MAX_FT_RESULTS = 8, SNIPPET_RADIUS = 140, MAX_SNIPPETS = 3, MAX_FULLTEXT_CHARS = 9000;
const CARD_FIELDS = ['id','date','analyst','sector','company','code','report_type','title',
                     'opinion','conviction','tone_label','one_line','points','post_url','source_url'];

const timelineOf = (e) => Array.isArray(e) ? e : (e && typeof e === 'object'
  ? (['timeline','reports','items','history'].map(k => e[k]).find(Array.isArray) || []) : []);
const nameOf = (e) => (e && typeof e === 'object'
  ? (['name','company','company_name'].map(k => e[k]).find(v => typeof v === 'string') || '') : '');

function resolveCompany(query, tone) {
  const companies = tone.companies || {};
  if (companies[query]) return [query, companies[query]];
  const q = query.trim().toLowerCase();
  if (!q) return null;
  for (const [code, entry] of Object.entries(companies)) {
    if (code.startsWith('IND:')) continue;
    if (code.toLowerCase().includes(q) || nameOf(entry).toLowerCase().includes(q)
        || timelineOf(entry).slice(0, 5).some(it => String(it?.title || '').toLowerCase().includes(q)))
      return [code, entry];
  }
  return null;
}

function companyView(query, tone) {
  const hit = resolveCompany(query, tone);
  if (!hit) return { error: `'${query}'에 해당하는 다올 커버 종목을 찾지 못했습니다. 미커버 종목이면 search_street 도구를 사용하세요.` };
  const [code, entry] = hit;
  const street = (tone.street && tone.street[code]) ?? (entry && entry.street) ?? null;
  return { code, name: nameOf(entry) || null,
           timeline_recent: timelineOf(entry).slice(-MAX_TIMELINE), street_position: street };
}

function sectorTone(sectorQuery, tone) {
  const q = sectorQuery.trim().toLowerCase();
  const result = { sector_rows: [], industry_timeline_recent: [] };
  const sectors = tone.sectors;
  const rows = Array.isArray(sectors) ? sectors : (sectors && typeof sectors === 'object' ? Object.values(sectors) : []);
  for (const row of rows) if (JSON.stringify(row).toLowerCase().includes(q)) result.sector_rows.push(row);
  const companies = tone.companies || {};
  for (const [code, entry] of Object.entries(companies)) {
    if (code.startsWith('IND:') && code.toLowerCase().includes(q)) {
      result.industry_timeline_recent = timelineOf(entry).slice(-MAX_TIMELINE);
      result.industry_key = code;
      break;
    }
  }
  if (!result.sector_rows.length && !result.industry_timeline_recent.length) {
    result.error = `'${sectorQuery}' 섹터를 찾지 못했습니다.`;
    result.available_industries = Object.keys(companies).filter(c => c.startsWith('IND:'));
  }
  return result;
}

function* iterAllReports(tone) {
  const seen = new Set();
  for (const entry of Object.values(tone.companies || {})) {
    for (const item of timelineOf(entry)) {
      if (!item || typeof item !== 'object') continue;
      const key = item.id || item.post_url;
      if (key && seen.has(key)) continue;
      if (key) seen.add(key);
      yield item;
    }
  }
}

function searchReports(query, tone, { analyst = '', sector = '', date_from = '', date_to = '' } = {}) {
  const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
  const matches = [];
  for (const item of iterAllReports(tone)) {
    if (analyst && !String(item.analyst || '').includes(analyst.trim())) continue;
    if (sector && !String(item.sector || '').includes(sector.trim())) continue;
    const date = String(item.date || '');
    if (date_from && date && date < date_from) continue;
    if (date_to && date && date > date_to) continue;
    if (terms.length) {
      const hay = [item.title, item.one_line, (item.points || []).join(' '),
                   item.company, item.analyst, item.sector].map(v => String(v ?? '')).join(' ').toLowerCase();
      if (!terms.every(t => hay.includes(t))) continue;
    }
    matches.push(item);
  }
  if (!matches.length) return { error: `조건(query='${query}', analyst='${analyst}', sector='${sector}')에 맞는 리포트가 없습니다.` };
  matches.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
  return { total_matches: matches.length,
           results: matches.slice(0, MAX_REPORTS).map(r => Object.fromEntries(CARD_FIELDS.filter(k => k in r).map(k => [k, r[k]]))) };
}

function flattenKed(ked) {
  if (Array.isArray(ked)) return ked;
  const rows = [];
  if (ked && typeof ked === 'object')
    for (const v of Object.values(ked)) Array.isArray(v) ? rows.push(...v) : (v && typeof v === 'object' && rows.push(v));
  return rows;
}

function streetSearch(query, ked) {
  const q = query.trim().toLowerCase();
  const rows = flattenKed(ked);
  const matches = rows.filter(r => r && typeof r === 'object' && JSON.stringify(r).toLowerCase().includes(q));
  if (!matches.length) return { error: `타사 리포트(120일)에서 '${query}'를 찾지 못했습니다.` };
  return { matches: matches.slice(0, MAX_STREET), total_matches: matches.length };
}

/* --- PDF 원문 검색 --- */
let metaIndexPromise = null;
function buildMetaIndex(tone, messages) {
  const index = new Map();
  for (const entry of Object.values(tone.companies || {})) {
    for (const item of timelineOf(entry)) {
      const src = item?.source_url;
      if (!src || index.has(src)) continue;
      index.set(src, { id: item.id, date: item.date, title: item.title, analyst: item.analyst,
                       sector: item.sector, company: item.company, code: item.code, post_url: item.post_url });
    }
  }
  for (const msg of messages || []) {
    for (const link of msg?.links || []) {
      if (link && !index.has(link))
        index.set(link, { id: String(msg.id ?? ''), date: String(msg.date || '').slice(0, 10),
                          title: String(msg.text || '').slice(0, 90), post_url: msg.post_url });
    }
  }
  return index;
}
async function getMetaIndex() {
  if (!metaIndexPromise) metaIndexPromise = (async () => {
    const tone = await loadJson('daol_tone_v2.json', '톤 데이터(3MB)');
    let messages = [];
    try { messages = await loadJson('daol_messages.json', '메시지 메타(6MB)'); } catch (e) { /* 폴백 메타 없이 진행 */ }
    return buildMetaIndex(tone, messages);
  })().catch(e => { metaIndexPromise = null; throw e; });
  return metaIndexPromise;
}
const entryText = (e) => (e && typeof e === 'object' && typeof e.text === 'string') ? e.text : '';

function snippetsOf(text, terms) {
  const lower = text.toLowerCase();
  const spans = [];
  outer: for (const term of terms) {
    let start = 0;
    while (spans.length < MAX_SNIPPETS) {
      const pos = lower.indexOf(term, start);
      if (pos < 0) break;
      const lo = Math.max(0, pos - SNIPPET_RADIUS), hi = Math.min(text.length, pos + term.length + SNIPPET_RADIUS);
      start = pos + term.length;
      if (spans.some(([slo, shi]) => lo < shi && hi > slo)) continue;
      spans.push([lo, hi]);
    }
    if (spans.length >= MAX_SNIPPETS) break outer;
  }
  spans.sort((a, b) => a[0] - b[0]);
  return spans.map(([lo, hi]) => '…' + text.slice(lo, hi).split(/\s+/).join(' ') + '…');
}

async function searchFulltext(query, { analyst = '', sector = '' } = {}) {
  const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) return { error: '검색어가 비어 있습니다.' };
  const [pdf, index] = await Promise.all([loadJson('daol_pdf_text_cache.json', 'PDF 원문(14MB)'), getMetaIndex()]);
  const scored = [];
  for (const [src, entry] of Object.entries(pdf)) {
    const text = entryText(entry);
    if (!text) continue;
    const meta = index.get(src) || {};
    if (analyst && !String(meta.analyst || '').includes(analyst.trim())) continue;
    if (sector && !String(meta.sector || '').includes(sector.trim())) continue;
    const lower = text.toLowerCase();
    let score = 0, miss = false;
    for (const t of terms) {
      let c = 0, p = -1;
      while ((p = lower.indexOf(t, p + 1)) >= 0) c++;
      if (!c) { miss = true; break; }
      score += c;
    }
    if (miss) continue;
    scored.push({ score, src, meta, text });
  }
  if (!scored.length) return { error: `원문 1,200여 건에서 '${query}'를 찾지 못했습니다. 검색어를 줄이거나 바꿔 보세요.` };
  scored.sort((a, b) => b.score - a.score || String(b.meta.date || '').localeCompare(String(a.meta.date || '')));
  return { total_matches: scored.length,
           results: scored.slice(0, MAX_FT_RESULTS).map(({ score, src, meta, text }) =>
             ({ ...meta, source_url: src, match_count: score, snippets: snippetsOf(text, terms) })) };
}

async function getFulltext(ref, around = '') {
  const [pdf, index] = await Promise.all([loadJson('daol_pdf_text_cache.json', 'PDF 원문(14MB)'), getMetaIndex()]);
  let src = null, meta = {};
  if (ref in pdf) { src = ref; meta = index.get(ref) || {}; }
  else for (const [url, m] of index) if (String(m.id) === String(ref) && url in pdf) { src = url; meta = m; break; }
  if (!src) return { error: `'${ref}'에 해당하는 원문을 찾지 못했습니다. search_report_fulltext로 먼저 검색하세요.` };
  const text = entryText(pdf[src]);
  if (!text) return { error: '이 리포트는 원문 텍스트가 없습니다(수집 실패 또는 이미지 PDF).' };
  if (around) {
    const pos = text.toLowerCase().indexOf(around.toLowerCase());
    if (pos >= 0) {
      const lo = Math.max(0, pos - Math.floor(MAX_FULLTEXT_CHARS / 2));
      const excerpt = text.slice(lo, lo + MAX_FULLTEXT_CHARS);
      return { ...meta, source_url: src, around, text: excerpt, truncated: text.length > excerpt.length };
    }
  }
  return { ...meta, source_url: src, text: text.slice(0, MAX_FULLTEXT_CHARS), truncated: text.length > MAX_FULLTEXT_CHARS };
}

/* --- 최선호주(탑픽): 최신 리포트에 없으면 가장 최근에 명시된 리포트를 거슬러 찾는다 --- */
function topPicks(tone, { sector = '', analyst = '' } = {}) {
  const hits = [];
  for (const item of iterAllReports(tone)) {
    if (!Array.isArray(item.top_picks) || !item.top_picks.length) continue;
    if (sector && !String(item.sector || '').includes(sector.trim())) continue;
    if (analyst && !String(item.analyst || '').includes(analyst.trim())) continue;
    hits.push(item);
  }
  if (!hits.length) {
    const avail = [...new Set([...iterAllReports(tone)]
      .filter(it => Array.isArray(it.top_picks) && it.top_picks.length)
      .map(it => it.sector).filter(Boolean))];
    return { error: `조건(sector='${sector}', analyst='${analyst}')에 탑픽이 명시된 리포트가 없습니다.`,
             sectors_with_picks: avail };
  }
  hits.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
  return {
    note: '탑픽은 매 리포트에 명시되지 않음 — 아래는 가장 최근에 탑픽을 명시한 리포트들. 인용 시 해당 리포트 날짜를 반드시 밝힐 것.',
    results: hits.slice(0, 5).map(it => ({
      date: it.date, sector: it.sector, analyst: it.analyst, title: it.title,
      top_picks: it.top_picks, post_url: it.post_url, source_url: it.source_url,
    })),
  };
}

/* --- 다올 vs 타사(스트리트) TP 비교 — street.stats는 파이프라인이 미리 계산 --- */
function compareStreet(tone, { sector = '', direction = '', limit = 15 } = {}) {
  const rows = [];
  for (const [code, entry] of Object.entries(tone.companies || {})) {
    if (code.startsWith('IND:') || !entry || typeof entry !== 'object') continue;
    const st = entry.street && entry.street.stats;
    if (!st || !st.daol || !st.median) continue;
    if (sector && !String(entry.sector || '').includes(sector.trim())) continue;
    // 이상치 방어: 타사 표본 1건뿐이거나 괴리가 ±100%를 넘으면 추출 오류 가능성이 높다
    if ((st.n || 0) < 2 || Math.abs(st.daol / st.median - 1) > 1) continue;
    rows.push({
      code, name: entry.name, sector: entry.sector,
      daol_tp: st.daol, street_median: st.median, street_low: st.low, street_high: st.high,
      street_n: st.n, gap_pct: Math.round((st.daol / st.median - 1) * 1000) / 10,
    });
  }
  if (!rows.length) return { error: '타사 비교 데이터가 있는 종목이 없습니다.' };
  rows.sort((a, b) => b.gap_pct - a.gap_pct);
  const out = direction === 'below' ? rows.slice().reverse() : rows;
  return { total: rows.length,
           note: 'gap_pct = 다올 TP ÷ 타사 중앙값 TP - 1 (%). 양수면 다올이 시장보다 강세.',
           results: out.slice(0, Math.min(Number(limit) || 15, 30)) };
}

function serialize(result) {
  let text = JSON.stringify(result);
  if (text.length > MAX_RESULT_CHARS) text = text.slice(0, MAX_RESULT_CHARS) + '… (이하 생략: 결과가 잘렸습니다. 더 구체적으로 조회하세요.)';
  return text;
}

// 이번 턴에 조회된 기업 — 답변이 끝나면 미니 차트로 렌더한다
let turnCharts = [];
function registerChart(code, tone) {
  if (turnCharts.some(c => c.code === code)) return;
  const entry = tone.companies && tone.companies[code];
  if (!entry) return;
  const series = timelineOf(entry)
    .filter(it => it && typeof it === 'object' && it.date)
    .map(it => ({ date: String(it.date), tp: it.tp_event && it.tp_event.value != null ? it.tp_event.value : null,
                  conv: it.conviction != null ? it.conviction : null }));
  if (series.length >= 2) turnCharts.push({ code, name: nameOf(entry) || code, series });
}

// 검색 결과가 한 종목에 몰리면(과반) 그 종목 차트를 그린다 — search_reports 경로의 사각지대 보완
function registerDominantChart(results, tone) {
  const counts = {};
  for (const it of results || []) if (it && it.code) counts[it.code] = (counts[it.code] || 0) + 1;
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  if (top && top[1] >= Math.max(2, (results.length || 0) * 0.5)) registerChart(top[0], tone);
}

// 다올 미커버 종목: 타사(스트리트) TP 변경 이력을 증권사별 점 차트로
function registerStreetChart(result, ked) {
  const counts = {};
  for (const m of result.matches || []) if (m && m.company) counts[m.company] = (counts[m.company] || 0) + 1;
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  if (!top || top[1] < Math.max(2, (result.matches.length || 0) * 0.6)) return; // 지배 종목이 없으면 생략
  const name = top[0];
  if (turnCharts.some(c => c.name === name)) return;
  const series = flattenKed(ked)
    .filter(r => r && r.company === name && r.tp_new != null && r.date)
    .map(r => ({ date: String(r.date), tp: r.tp_new, broker: String(r.brokerage || '') }))
    .sort((a, b) => a.date.localeCompare(b.date));
  if (series.length >= 2) turnCharts.push({ kind: 'street', code: 'ST:' + name, name, series });
}

async function runTool(name, input) {
  switch (name) {
    case 'get_today_briefing': return serialize(await loadJson('tone_summary.json'));
    case 'get_company_view': {
      const tone = await loadJson('daol_tone_v2.json', '톤 데이터(3MB)');
      const r = companyView(input.company || '', tone);
      if (!r.error) registerChart(r.code, tone);
      return serialize(r);
    }
    case 'get_sector_tone': return serialize(sectorTone(input.sector || '', await loadJson('daol_tone_v2.json', '톤 데이터(3MB)')));
    case 'search_reports': {
      const tone = await loadJson('daol_tone_v2.json', '톤 데이터(3MB)');
      const r = searchReports(input.query || '', tone, input);
      if (!r.error) registerDominantChart(r.results, tone);
      return serialize(r);
    }
    case 'search_report_fulltext': return serialize(await searchFulltext(input.query || '', input));
    case 'get_report_fulltext': return serialize(await getFulltext(input.ref || '', input.around || ''));
    case 'search_street': {
      const ked = await loadJson('ked_street.json');
      const r = streetSearch(input.company || '', ked);
      if (!r.error) registerStreetChart(r, ked);
      return serialize(r);
    }
    case 'get_top_picks': return serialize(topPicks(await loadJson('daol_tone_v2.json', '톤 데이터(3MB)'), input));
    case 'get_fundamentals': {
      const tone = await loadJson('daol_tone_v2.json', '톤 데이터(3MB)');
      const hit = resolveCompany(input.company || '', tone);
      if (!hit) return serialize({ error: `'${input.company}'는 다올 커버 종목이 아닙니다. search_street를 사용하세요.` });
      let funda = null;
      try { funda = await loadJson('naver_fundamentals.json'); } catch (e) {}
      const f = funda && funda.companies && funda.companies[hit[0]];
      if (!f) return serialize({ error: '이 종목의 재무 지표 데이터가 아직 없습니다.' });
      registerChart(hit[0], tone);
      return serialize({ code: hit[0], unit_note: funda.unit_note, source: funda.source, ...f });
    }
    case 'compare_daol_vs_street': return serialize(compareStreet(await loadJson('daol_tone_v2.json', '톤 데이터(3MB)'), input));
    default: return serialize({ error: `알 수 없는 도구: ${name}` });
  }
}

  let content, isError = false;
  try { content = await runTool(name, input || {}); }
  catch (err) { content = `도구 실행 오류: ${err.message}`; isError = true; }
  note.remove();
  return { content, isError };
}

/* --- Anthropic (Claude) --- */
async function callAnthropic(messages) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': ($('apikey').value || '').trim(),
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: $('model').value,
      max_tokens: 16000,
      system: [{ type: 'text', text: SYSTEM_PROMPT, cache_control: { type: 'ephemeral' } }],
      tools: TOOLS,
      messages,
    }),
  });
  if (!res.ok) {
    let detail = '';
    try { detail = (await res.json()).error?.message || ''; } catch (e) {}
    if (res.status === 401) throw new Error('Anthropic API 키가 유효하지 않습니다. 키를 확인해 주세요.');
    if (res.status === 429) throw new Error('요청 한도(rate limit)에 걸렸습니다. 잠시 후 다시 시도해 주세요.');
    throw new Error(`API 오류 (HTTP ${res.status}) ${detail}`.trim());
  }
  return res.json();
}

async function answerAnthropic() {
  const messages = textHistory.slice(-MAX_HISTORY_TURNS).map(t => ({ role: t.role, content: t.text }));
  for (let round = 0; round <= MAX_TOOL_ROUNDS; round++) {
    const response = await callAnthropic(messages);
    if (response.stop_reason === 'refusal')
      return '요청을 처리할 수 없습니다. 질문을 바꿔서 다시 시도해 주세요.';
    messages.push({ role: 'assistant', content: response.content });
    const toolUses = response.content.filter(b => b.type === 'tool_use');
    if (!toolUses.length || round === MAX_TOOL_ROUNDS) {
      const text = response.content.filter(b => b.type === 'text').map(b => b.text).join('');
      return text || '답변을 생성하지 못했습니다. 다시 시도해 주세요.';
    }
    const results = [];
    for (const tu of toolUses) {
      const { content, isError } = await execTool(tu.name, tu.input);
      results.push({ type: 'tool_result', tool_use_id: tu.id, content, is_error: isError });
    }
    messages.push({ role: 'user', content: results });
  }
}

/* --- Gemini (무료 티어) --- */
function toGeminiSchema(s) {
  if (!s || typeof s !== 'object') return s;
  const out = {};
  if (s.type) out.type = String(s.type).toUpperCase();
  if (s.description) out.description = s.description;
  if (s.enum) out.enum = s.enum;
  if (s.required && s.required.length) out.required = s.required;
  if (s.items) out.items = toGeminiSchema(s.items);
  if (s.properties) {
    out.properties = {};
    for (const [k, v] of Object.entries(s.properties)) out.properties[k] = toGeminiSchema(v);
  }
  return out; // additionalProperties는 Gemini 미지원 — 제거
}
const GEMINI_TOOLS = TOOLS.map(t => {
  const params = toGeminiSchema(t.input_schema);
  const decl = { name: t.name, description: t.description };
  if (params.properties && Object.keys(params.properties).length) decl.parameters = params;
  return decl; // 빈 파라미터 스키마는 생략(get_today_briefing)
});

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

async function waitWithNote(seconds, why) {
  const note = bubble('status', '');
  for (let s = seconds; s > 0; s--) {
    note.textContent = `${why} — ${s}초 뒤 자동 재시도`;
    await sleep(1000);
  }
  note.remove();
}

// 한도(429)·과부하(503) 시 순서대로 갈아탈 모델 사슬 — -latest 별칭이 가리키는
// 최신 모델이 붐빌 때 수요가 적은 구버전이 대개 여유롭다.
const GEMINI_FALLBACKS = {
  'gemini-flash-lite-latest': ['gemini-2.5-flash-lite', 'gemini-2.5-flash'],
  'gemini-flash-latest': ['gemini-flash-lite-latest', 'gemini-2.5-flash-lite'],
};
const shortName = (m) => m.replace('gemini-', '').replace('-latest', '(최신)');

// SSE 스트림을 읽어 텍스트는 onText로 흘리고, 함수 호출·종료 사유를 모아 돌려준다.
async function readGeminiStream(res, onText) {
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', text = '', finish = '';
  const calls = [];
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, idx).trim();
      buf = buf.slice(idx + 1);
      if (!line.startsWith('data:')) continue;
      const payload = line.slice(5).trim();
      if (!payload || payload === '[DONE]') continue;
      let j;
      try { j = JSON.parse(payload); } catch (e) { continue; }
      const cand = (j.candidates || [])[0];
      if (!cand) continue;
      if (cand.finishReason) finish = cand.finishReason;
      for (const p of (cand.content && cand.content.parts) || []) {
        if (p.text) { text += p.text; if (onText) onText(text); }
        if (p.functionCall) calls.push(p);
      }
    }
  }
  return { text, calls, finish };
}

// 한도·과부하로 폴백이 일어나면 당분간(10분) 그 모델에서 바로 시작한다 —
// 도구 호출 라운드마다 사다리를 처음부터 다시 타면 한 질문에 수백 초가 걸린다.
let geminiSticky = null; // {model, until}

async function callGemini(contents, onText) {
  const primary = $('model').value;
  let chain = [primary, ...(GEMINI_FALLBACKS[primary] || ['gemini-2.5-flash-lite'])];
  if (geminiSticky && geminiSticky.until > Date.now() && chain.includes(geminiSticky.model))
    chain = chain.slice(chain.indexOf(geminiSticky.model));
  let lastErr = '';
  for (let m = 0; m < chain.length; m++) {
    const model = chain[m];
    const attempts = 2; // 모델당 재시도는 짧게 — 안 풀리면 빨리 다음 모델로
    let noThinkCfg = false; // 사고 설정을 모델이 거부하면 빼고 재시도
    for (let attempt = 0; attempt < attempts; attempt++) {
      const body = {
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents,
        tools: [{ functionDeclarations: GEMINI_TOOLS }],
      };
      // 근거는 도구(데이터)가 대므로 긴 내부 사고는 지연만 키운다 — 최소로 억제.
      // 2.5 계열은 thinkingBudget:0(사고 끔), 3.x 계열은 thinkingLevel:'low'.
      if (!noThinkCfg) body.generationConfig = { thinkingConfig:
        /^gemini-2\.5/.test(model) ? { thinkingBudget: 0 } : { thinkingLevel: 'low' } };
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse`, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-goog-api-key': ($('apikey').value || '').trim() },
        body: JSON.stringify(body),
      });
      if (res.ok) {
        geminiSticky = model === primary ? null
          : { model, until: Date.now() + 10 * 60 * 1000 };
        return readGeminiStream(res, onText);
      }
      let err = {};
      try { err = (await res.json()).error || {}; } catch (e) {}
      const detail = err.message || '';
      if (res.status === 400 && /api key/i.test(detail))
        throw new Error('Gemini API 키가 유효하지 않습니다. aistudio.google.com/apikey에서 확인해 주세요.');
      if (res.status === 400 && !noThinkCfg && /thinking|unknown name|invalid json/i.test(detail)) {
        noThinkCfg = true; attempt--; continue; // 이 모델이 사고 설정을 모르면 빼고 즉시 재시도
      }
      let delay, why;
      if (res.status === 429) {
        // 무료 한도: 서버가 알려준 대기시간(RetryInfo)을 따르되 30초 상한 —
        // 그보다 길게 기다릴 바엔 다음 모델로 넘어가는 편이 빠르다
        delay = 20;
        const ri = (err.details || []).find(d => String(d['@type'] || '').includes('RetryInfo'));
        const parsed = ri && parseFloat(ri.retryDelay);
        if (parsed > 0) delay = Math.min(30, Math.ceil(parsed));
        why = `무료 한도(${shortName(model)})`;
      } else if (res.status === 500 || res.status === 503 || res.status === 504) {
        delay = 5 * (attempt + 1); // 과부하는 짧게 쉬면 풀리는 경우가 많다
        why = `모델 과부하(${shortName(model)})`;
      } else {
        throw new Error(`Gemini API 오류 (HTTP ${res.status}) ${detail}`.trim().slice(0, 300));
      }
      lastErr = `HTTP ${res.status} ${detail}`.trim();
      if (attempt < attempts - 1) await waitWithNote(delay, why);
    }
    if (m < chain.length - 1)
      bubble('status', `${shortName(model)}이(가) 계속 응답하지 못해 ${shortName(chain[m + 1])}(으)로 전환합니다.`);
  }
  throw new Error(`Gemini가 계속 응답하지 못합니다(한도 또는 과부하). 잠시 후 다시 시도해 주세요. 마지막 오류: ${lastErr.slice(0, 200)}`);
}

let hidePending = null; // 스트리밍 첫 글자가 도착하면 '생각 중…'을 치운다 (ask()가 설정)

async function answerGemini() {
  const contents = textHistory.slice(-MAX_HISTORY_TURNS).map(t =>
    ({ role: t.role === 'assistant' ? 'model' : 'user', parts: [{ text: t.text }] }));
  let live = null; // 스트리밍 중 실시간 갱신되는 답변 말풍선
  const onText = (t) => {
    if (hidePending) { hidePending(); hidePending = null; }
    if (!live) live = bubble('assistant', '');
    live.innerHTML = mdToHtml(t);
    chat.scrollTop = chat.scrollHeight;
  };
  for (let round = 0; round <= MAX_TOOL_ROUNDS; round++) {
    live = null;
    const r = await callGemini(contents, onText);
    if (r.finish === 'SAFETY' || r.finish === 'PROHIBITED_CONTENT') {
      if (live) live.remove();
      return { text: '요청을 처리할 수 없습니다. 질문을 바꿔서 다시 시도해 주세요.', rendered: false };
    }
    if (!r.calls.length || round === MAX_TOOL_ROUNDS) {
      const text = r.text || '답변을 생성하지 못했습니다. 다시 시도해 주세요.';
      return { text, rendered: !!(live && r.text) };
    }
    // 도구 라운드: 스트리밍된 서두 텍스트는 그대로 두고 함수 호출을 실행한다
    const modelParts = [];
    if (r.text) modelParts.push({ text: r.text });
    modelParts.push(...r.calls);
    contents.push({ role: 'model', parts: modelParts });
    const frParts = [];
    for (const p of r.calls) {
      const fc = p.functionCall;
      const { content, isError } = await execTool(fc.name, fc.args || {});
      const fr = { name: fc.name, response: isError ? { error: content } : { result: content } };
      if (fc.id) fr.id = fc.id; // 병렬 호출 매칭용(있을 때만)
      frParts.push({ functionResponse: fr });
    }
    contents.push({ role: 'user', parts: frParts });
  }
}

async function answer(question) {
  textHistory.push({ role: 'user', text: question });
  try {
    const r = currentProvider() === 'gemini'
      ? await answerGemini()
      : { text: await answerAnthropic(), rendered: false };
    textHistory.push({ role: 'assistant', text: r.text });
    saveTurn('user', question);
    saveTurn('assistant', r.text);
    return r;
  } catch (err) {
    textHistory.pop(); // 실패한 질문은 이력에서 제거
    throw err;
  }
}

/* ============ UI ============ */
const chat = $('chat'), form = $('form'), input = $('input'), send = $('send');

/* --- 경량 마크다운 렌더러 (답변 말풍선용) — HTML 이스케이프 후 변환 --- */
const escapeHtml = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function inlineMd(s) {
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdToHtml(text) {
  const out = [];
  let list = null, para = [];
  const flushPara = () => { if (para.length) { out.push('<p>' + para.map(inlineMd).join('<br>') + '</p>'); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.tag}>` + list.items.map(i => '<li>' + inlineMd(i) + '</li>').join('') + `</${list.tag}>`); list = null; } };
  for (const line of escapeHtml(text).split('\n')) {
    if (!line.trim()) { flushPara(); flushList(); continue; }
    const h = line.match(/^(#{1,5})\s+(.*)/);
    if (h) { flushPara(); flushList(); const lv = Math.min(5, h[1].length + 2); out.push(`<h${lv}>` + inlineMd(h[2]) + `</h${lv}>`); continue; }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { flushPara(); flushList(); out.push('<hr>'); continue; }
    const ul = line.match(/^\s*[-*•]\s+(.*)/), ol = line.match(/^\s*\d+[.)]\s+(.*)/);
    if (ul) { flushPara(); if (!list || list.tag !== 'ul') { flushList(); list = { tag: 'ul', items: [] }; } list.items.push(ul[1]); continue; }
    if (ol) { flushPara(); if (!list || list.tag !== 'ol') { flushList(); list = { tag: 'ol', items: [] }; } list.items.push(ol[1]); continue; }
    flushList(); para.push(line);
  }
  flushPara(); flushList();
  return out.join('');
}

function bubble(cls, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  if (cls === 'assistant') { div.classList.add('md'); div.innerHTML = mdToHtml(text); }
  else div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

/* --- 기업 미니 차트: TP(선) + 확신도(점) 추이 SVG --- */
const BROKER_COLORS = ['#0f4c81', '#1e7a4f', '#9a6b1f', '#7b4b94', '#b23a48', '#2a7b8c', '#5c5f66'];

function streetChartBubble(cd) {
  const s = cd.series, n = s.length;
  const W = 340, H = 86, PAD = 10;
  const x = (i) => PAD + (W - 2 * PAD) * (n === 1 ? 0.5 : i / (n - 1));
  const tps = s.map(p => p.tp);
  const lo = Math.min(...tps), hi = Math.max(...tps);
  const y = (v) => hi === lo ? H / 2 : PAD + (H - 2 * PAD) * (1 - (v - lo) / (hi - lo));
  const brokers = [...new Set(s.map(p => p.broker))];
  const color = (b) => BROKER_COLORS[brokers.indexOf(b) % BROKER_COLORS.length];
  const svg = s.map((p, i) =>
    `<circle cx="${Math.round(x(i))}" cy="${Math.round(y(p.tp))}" r="3.4" fill="${color(p.broker)}" fill-opacity=".85">` +
    `<title>${p.date} ${escapeHtml(p.broker)} ${Math.round(p.tp).toLocaleString()}원</title></circle>`).join('');
  const last = s[n - 1];
  const div = document.createElement('div');
  div.className = 'msg assistant chart';
  div.innerHTML =
    `<div class="chart-title">📊 ${escapeHtml(cd.name)} — 타사 TP 추이 (증권사별 색, 다올 미커버)</div>` +
    `<svg viewBox="0 0 ${W} ${H}" role="img">${svg}</svg>` +
    `<div class="chart-cap">${s[0].date} ~ ${last.date} · TP 변경 ${n}건 · ${brokers.length}개 증권사 · ` +
    `범위 ${Math.round(lo).toLocaleString()}~${Math.round(hi).toLocaleString()}원</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

/* --- 재무·밸류 표 (네이버 금융 컨센서스, 커버 종목 차트 아래) --- */
function fundaTableHtml(f) {
  const y25 = f.years && f.years['2025'], y26 = f.years && f.years['2026'];
  if (!y25 && !y26) return '';
  const fmt = (v, d) => v == null ? '—'
    : Number(v).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: 0 });
  const rows = [
    ['매출액(억원)', 'revenue', 0, ''], ['영업이익(억원)', 'op', 0, ''], ['영업이익률', 'opm', 1, '%'],
    ['순이익(억원)', 'ni', 0, ''], ['PER(배)', 'per', 1, ''], ['PBR(배)', 'pbr', 2, ''],
    ['ROE', 'roe', 1, '%'], ['PSR(배)', 'psr', 1, ''], ['EV/EBITDA(배)', 'ev_ebitda', 1, ''],
  ].filter(([, k]) => k !== 'ev_ebitda' || (y25 && y25[k] != null) || (y26 && y26[k] != null));
  const head = (y, label) => label + (y && y.est ? '(E)' : '');
  const cell = (y, k, d, suf) => y && y[k] != null ? fmt(y[k], d) + suf : '—';
  const tr = rows.map(([lab, k, d, suf]) =>
    `<tr><td>${lab}</td><td>${cell(y25, k, d, suf)}</td><td>${cell(y26, k, d, suf)}</td></tr>`).join('');
  const mcap = (y26 && y26.mcap_implied) || (y25 && y25.mcap_implied);
  return `<div class="funda"><table><tr><th>NAVER 컨센</th><th>${head(y25, '2025')}</th><th>${head(y26, '2026')}</th></tr>${tr}</table>` +
    `<div class="chart-cap">출처: 네이버 금융 · (E)=컨센서스 추정${mcap ? ` · 시총(컨센 함의) 약 ${fmt(mcap, 0)}억원` : ''}</div></div>`;
}

function chartBubble(cd, funda) {
  if (cd.kind === 'street') return streetChartBubble(cd);
  const s = cd.series;
  const n = s.length;
  if (n < 2) return;
  const W = 340, H = 96, PAD = 8, CONV_H = 22;
  const x = (i) => PAD + (W - 2 * PAD) * i / (n - 1);
  const lineArea = H - CONV_H - 10;
  let svg = '';
  const tps = s.map(p => p.tp).filter(v => v != null);
  let tpLabel = '';
  if (tps.length >= 2) {
    const lo = Math.min(...tps), hi = Math.max(...tps);
    const y = (v) => hi === lo ? lineArea / 2 + PAD : PAD + (lineArea - 2 * PAD) * (1 - (v - lo) / (hi - lo));
    const pts = s.map((p, i) => p.tp != null ? [x(i), y(p.tp)] : null).filter(Boolean);
    svg += '<polyline fill="none" stroke="#0f4c81" stroke-width="2" points="'
        + pts.map(p => p.map(v => Math.round(v * 10) / 10).join(',')).join(' ') + '"/>';
    svg += pts.map(p => `<circle cx="${Math.round(p[0])}" cy="${Math.round(p[1])}" r="2.6" fill="#0f4c81"/>`).join('');
    const last = tps[tps.length - 1];
    tpLabel = ` · TP ${lo === hi ? '' : Math.round(lo).toLocaleString() + '~' + Math.round(hi).toLocaleString() + '원, '}최신 ${Math.round(last).toLocaleString()}원`;
  }
  // 확신도: 배터리식 1~5칸 — 칸을 나눠 그려 4와 5가 한눈에 구분되게
  const convColor = { 1: '#c0392b', 2: '#e0762f', 3: '#9aa39d', 4: '#5a9b6e', 5: '#1e7a4f' };
  const bw = 8, bh = 16, seg = (bh - 2) / 5; // 칸 5개 + 칸 사이 여백
  const by = H - CONV_H + (CONV_H - bh) / 2;
  svg += s.map((p, i) => {
    if (p.conv == null) return '';
    const bx = Math.round(x(i) - bw / 2);
    const color = convColor[p.conv] || '#9aa39d';
    let cells = '';
    for (let k = 0; k < 5; k++) {
      const filled = k < p.conv;
      const cy2 = by + 1 + (4 - k) * seg; // 아래부터 채운다
      cells += `<rect x="${bx + 1.5}" y="${(cy2 + 0.4).toFixed(1)}" width="${bw - 3}" height="${(seg - 0.8).toFixed(1)}"` +
               ` fill="${filled ? color : 'none'}" ${filled ? '' : 'fill-opacity="0"'} stroke="none"/>`;
    }
    return `<g><rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="2" fill="none" stroke="#9aa39d" stroke-width="1"/>` +
           `${cells}<title>${p.date} 확신도 ${p.conv}/5</title></g>`;
  }).join('');
  const div = document.createElement('div');
  div.className = 'msg assistant chart';
  const f = funda && funda.companies && funda.companies[cd.code];
  div.innerHTML =
    `<div class="chart-title">📈 ${escapeHtml(cd.name)} — TP(선) · 확신도(배터리 1~5칸)</div>` +
    `<svg viewBox="0 0 ${W} ${H}" role="img">${svg}</svg>` +
    `<div class="chart-cap">${s[0].date} ~ ${s[n - 1].date} · 리포트 ${n}건${tpLabel}</div>` +
    (f ? fundaTableHtml(f) : '');
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function ask(question) {
  if (!($('apikey').value || '').trim()) { bubble('error', '먼저 위에 API 키를 입력하고 저장해 주세요. Gemini 키는 aistudio.google.com/apikey에서 무료 발급됩니다.'); return; }
  localStorage.setItem(PROVIDERS[currentProvider()].ls, $('apikey').value.trim());
  bubble('user', question);
  input.value = '';
  send.disabled = true;
  turnCharts = [];
  const pending = bubble('assistant status', '생각 중…');
  hidePending = () => pending.remove();
  const t0 = Date.now();
  const ticker = setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000);
    if (s >= 5) pending.textContent = `생각 중… (${s}초)`;
  }, 1000);
  try {
    const r = await answer(question);
    pending.remove();
    if (!r.rendered) bubble('assistant', r.text);
    let funda = null;
    if (turnCharts.some(c => c.kind !== 'street')) {
      try { funda = await loadJson('naver_fundamentals.json'); } catch (e) {}
    }
    for (const cd of turnCharts.slice(0, 2)) chartBubble(cd, funda);
  } catch (err) {
    pending.remove();
    bubble('error', err.message || '오류가 발생했습니다.');
  } finally {
    hidePending = null;
    clearInterval(ticker);
    send.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (q && !send.disabled) ask(q);
});
document.querySelectorAll('.hints button').forEach(b =>
  b.addEventListener('click', () => { if (!send.disabled) ask(b.textContent); }));

/* 오늘의 브리핑: 파이프라인이 미리 만들어 둔 daily_brief.json을 카드로 (매일 KST 08:30 갱신) */
(async function renderBrief() {
  try {
    const res = await fetch('./daily_brief.json', { cache: 'no-cache' });
    if (!res.ok) return;
    const b = await res.json();
    if (!b || !b.text) return;
    const det = document.createElement('details');
    det.id = 'brief';
    det.open = true;
    const sum = document.createElement('summary');
    sum.textContent = `📋 오늘의 브리핑 · ${b.date}${b.ai ? '' : ' (자동 요약)'}`;
    det.appendChild(sum);
    const body = document.createElement('div');
    body.className = 'msg assistant md';
    body.innerHTML = mdToHtml(b.text);
    det.appendChild(body);
    chat.prepend(det);
  } catch (e) { /* 브리핑 없으면 조용히 생략 */ }
})();

/* 지난 대화: 접힌 로그로 보여주고, 이어서 대화할 수 있게 문맥도 복원 */
(function renderPastLog() {
  const log = loadLog();
  if (!log.length) return;
  textHistory.push(...log.slice(-MAX_HISTORY_TURNS).map(({ role, text }) => ({ role, text })));
  const det = document.createElement('details');
  det.id = 'pastlog';
  const sum = document.createElement('summary');
  sum.textContent = `지난 대화 ${Math.ceil(log.length / 2)}건 보기 — 이어서 질문할 수 있습니다`;
  det.appendChild(sum);
  const body = document.createElement('div');
  body.id = 'pastlog-body';
  for (const t of log) {
    const div = document.createElement('div');
    if (t.role === 'user') { div.className = 'msg user'; div.textContent = t.text; }
    else { div.className = 'msg assistant md'; div.innerHTML = mdToHtml(t.text); }
    body.appendChild(div);
  }
  const clr = document.createElement('button');
  clr.id = 'clearlog';
  clr.type = 'button';
  clr.textContent = '지난 대화 지우기';
  clr.onclick = () => { localStorage.removeItem(LS_LOG); det.remove(); textHistory.length = 0; };
  body.appendChild(clr);
  det.appendChild(body);
  chat.appendChild(det);
})();

if (location.protocol === 'file:') bubble('error', '이 페이지는 웹 서버에서 열어야 데이터 JSON을 읽을 수 있습니다. https://gschoie.github.io/DAOL-RESEARCH-TONE/chat.html 로 접속하세요.');
if (keyImported) bubble('status', '베타테스트 키가 설정되었습니다. 바로 질문해 보세요!');
else if (!($('apikey').value || '').trim()) bubble('status', 'API 키를 입력·저장한 뒤 질문하세요. Gemini 키는 aistudio.google.com/apikey에서 카드 등록 없이 무료로 받을 수 있습니다. 키는 이 브라우저에만 저장됩니다.');
</script>
