<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAOL 리서치 톤</title>
<style>
:root{--bg:#f3f4f1;--ink:#17211d;--muted:#6c746f;--line:#dfe2dc;--green:#173f35;--lime:#d9f272;--red:#bd4335}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Pretendard,"Noto Sans KR",sans-serif;font-size:14px}
.wrap{max-width:1440px;margin:auto;padding:22px 20px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;border-bottom:2px solid #263d35;padding-bottom:12px;margin-bottom:14px;flex-wrap:wrap}
.hero .eyebrow{margin:0 0 4px;font-size:10px;letter-spacing:.14em;color:#68736d}
.hero h1{margin:0;font:500 26px Georgia}
.hero .links{display:flex;gap:12px;align-items:center;font-size:12px}
.hero a{color:#386453;text-decoration:none}
.hero a:hover{text-decoration:underline}
.tone-toolbar{display:grid;grid-template-columns:minmax(240px,1fr) 150px 180px auto auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);padding:15px;margin-bottom:14px}
.tone-toolbar input,.tone-toolbar select{width:100%;border:1px solid #cfd6d0;border-radius:6px;background:#fff;padding:9px 11px;color:var(--ink);font-size:13px}
.tone-toolbar button{border:0;border-radius:6px;background:var(--green);color:#fff;padding:10px 16px;cursor:pointer}
.tone-toolbar span{font-size:11px;color:var(--muted);white-space:nowrap}
#street-lookup-btn{background:#3d6c9e}
.lookup-input{width:100%;border:1px solid #cfd6d0;border-radius:8px;padding:12px 14px;font-size:15px;margin:12px 0;font-family:inherit}
.lookup-input:focus{outline:0;border-color:#3d6c9e}
.lookup-company{border:1px solid var(--line);margin-bottom:12px;background:#fff}
.lookup-head{display:flex;gap:10px;align-items:center;padding:9px 12px;background:#f2f5f8;border-bottom:1px solid var(--line)}
.lookup-head b{font-size:14px}
.lookup-head small{color:var(--muted);flex:1}
.tone-empty{color:var(--muted);font-size:12px}
.tone-loading{background:#fff;border:1px solid var(--line);padding:40px;text-align:center;color:var(--muted)}
.tone-event-wrap{background:#fff;border:1px solid var(--line);margin-bottom:14px}
.tone-event-wrap>summary{cursor:pointer;list-style:none;padding:13px 16px;font-weight:700;font-size:13px;border-bottom:1px solid transparent}
.tone-event-wrap>summary::-webkit-details-marker{display:none}
.tone-event-wrap[open]>summary{border-bottom-color:var(--line)}
.tone-event-wrap>summary em{font-style:normal;color:var(--muted);font-weight:500;font-size:11px;margin-left:7px}
.tone-event-cols{display:grid;grid-template-columns:1fr 1fr}
.tone-event-col{min-width:0}
.tone-event-col+.tone-event-col{border-left:1px solid var(--line)}
.tone-event-col h5{margin:0;padding:9px 16px 7px;font-size:10.5px;color:#68736d;letter-spacing:.05em;border-bottom:1px solid #eef1ec}
.tone-event-list{max-height:280px;overflow-y:auto;padding:6px 0}
.tone-event{display:flex;gap:9px;align-items:baseline;width:100%;border:0;background:transparent;text-align:left;padding:7px 16px;cursor:pointer;font-family:inherit;font-size:12px;border-left:3px solid transparent}
.tone-event:hover{background:#f4f7f4}
.tone-event.up{border-left-color:#2e7d4f}.tone-event.down{border-left-color:var(--red)}.tone-event.mid{border-left-color:#b78c2c}
.tone-event.hold{border-left-color:#c9d2cb}.tone-event.hold em{color:#75807a}
.tone-event small{color:var(--muted);white-space:nowrap}
.tone-event em{font-style:normal;font-weight:700;white-space:nowrap;font-size:11px}
.tone-event.up em{color:#2e7d4f}.tone-event.down em{color:var(--red)}.tone-event.mid em{color:#8a661c}
.tone-event b{white-space:nowrap}
.tone-event span{color:#45534c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tone-event i{font-style:normal;color:var(--muted);font-size:11px;white-space:nowrap}
.tone-event em.up{color:#2e7d4f}.tone-event em.down{color:var(--red)}.tone-event em.mid{color:#8a661c}
.tone-event u{text-decoration:none;font-size:10px;font-weight:700;white-space:nowrap;padding:1px 5px;border-radius:8px;background:#f0f3ee}
.tone-event u.up{color:#2e7d4f}.tone-event u.down{color:var(--red)}
.tone-event q.evq{quotes:none;font-size:10.5px;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:1px 6px;border-radius:8px}
.tone-event q.evq.up{color:#1f6b43;background:#eaf5ee}.tone-event q.evq.down{color:#a43c31;background:#f9ecea}
.top-picks{border-left:4px solid #b8862d;background:#fdf7ea;padding:9px 12px;margin-bottom:10px}
.top-picks b{display:block;font-size:11px;color:#7a5a15;letter-spacing:.05em;margin-bottom:4px}
.top-picks b small{font-weight:400;color:#a08b56;font-size:10px}
.top-picks p{margin:3px 0;font-size:12px;line-height:1.55}
.cov-tp{max-height:150px;overflow-y:auto;border:1px solid #eef1ec}
.cov-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;border:0;border-bottom:1px solid #f0f3ee;background:#fff;text-align:left;padding:6px 9px;cursor:pointer;font-family:inherit;font-size:12px;align-items:center}
.cov-row:hover{background:#f4f7f4}
.cov-row b{font-size:12px}
.cov-row .cov-val{font-weight:700;white-space:nowrap}
.cov-row .cov-val.up{color:#2e7d4f}.cov-row .cov-val.down{color:var(--red)}
.cov-row small{grid-column:1/3;color:var(--muted);font-size:10px}
.tone-table-wrap{background:#fff;border:1px solid var(--line);overflow-x:auto}
.tone-table{width:100%;border-collapse:collapse;font-size:12px;min-width:940px}
.th-sort{cursor:pointer;user-select:none}.th-sort:hover{text-decoration:underline}.th-sort em{font-style:normal;color:#386453;font-size:10px}
.tone-table th{position:sticky;top:0;background:#f6f8f5;text-align:left;padding:11px 12px;font-size:11px;color:#5b665f;letter-spacing:.03em;border-bottom:2px solid #263d35;white-space:nowrap}
.tone-table td{padding:10px 12px;border-bottom:1px solid #eef1ec;vertical-align:top}
.tone-sector-group{border-top:2px solid #263d35}
.sec-flat{background:#f7f9f6;font-size:12px}.sec-flat .sec-name{border:0;background:transparent;padding:0;cursor:pointer;font-family:Georgia;font-weight:700;font-size:12.5px;color:#173f35;text-align:left}.sec-flat .sec-name:hover{text-decoration:underline}
.sec-cell{background:#f2f5f1;border-right:1px solid var(--line);min-width:96px;max-width:130px;vertical-align:top}
.sec-cell .sec-name{display:block;border:0;background:transparent;padding:0;cursor:pointer;text-align:left;font-family:Georgia;font-size:13.5px;font-weight:700;color:#173f35;line-height:1.35}.sec-cell .sec-name:hover{text-decoration:underline;color:#386453}
.sec-cell small{display:block;color:var(--muted);margin-top:3px}
.sector-ind{border:0;background:transparent;color:#386453;cursor:pointer;font-size:11px;padding:0;margin-top:7px;font-family:inherit;text-align:left}
.sector-ind:hover{text-decoration:underline}
.ta-name .analyst-link{border:0;background:transparent;font-weight:700;font-size:14px;font-family:inherit;color:var(--ink);cursor:pointer;padding:0}
.ta-name .analyst-link:hover{color:#386453;text-decoration:underline}
.ta-name small{display:block;color:var(--muted);margin-top:3px}
.op-badge{display:inline-block;border-radius:11px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.op-badge.op-up{background:#e3f3e7;color:#286342}.op-badge.op-down{background:#f8e9e6;color:#a43c31}.op-badge.op-mid{background:#fff1cf;color:#765c19}.op-badge.op-none{background:#eef1ec;color:#75807a}
.op-date{display:block;color:var(--muted);margin-top:3px;font-size:10px}
.conv-dots{color:#173f35;letter-spacing:1.5px;font-size:11px}
.tone-cell small{display:block;color:var(--muted);margin-top:2px;font-size:10px}
.tone-cell{max-width:250px}
.cell-phrases{margin-top:5px}
.cell-phrases q{quotes:none;display:block;font-size:10.5px;line-height:1.45;padding:2px 7px;border-radius:7px;margin:2px 0;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
.cell-phrases q.up{color:#1f6b43;background:#eaf5ee}.cell-phrases q.down{color:#a43c31;background:#f9ecea}
.tone-cell.t-strong .conv-dots{color:#1f6b43}.tone-cell.t-pos .conv-dots{color:#3c6b58}.tone-cell.t-cau .conv-dots{color:#a1742a}.tone-cell.t-neg .conv-dots{color:var(--red)}
.conv-spark{display:block}
.tp-chip{display:block;border:1px solid #e3ddd0;background:#faf8f2;font-family:inherit;font-size:11px;text-align:left;padding:5px 8px;margin:0 0 5px;cursor:pointer;border-left:3px solid #8a5a2b;max-width:250px}
.tp-chip.up{border-left-color:#2e7d4f}.tp-chip.down{border-left-color:var(--red)}
.tp-chip:hover{background:#f2efe4}
.tp-reason{font-style:normal;display:inline-block;background:#ece7d8;color:#6d5b28;border-radius:8px;padding:1px 6px;margin-left:4px;font-size:10px}
.company-mini{border:1px solid #dce4dd;background:#f2f6f2;color:#2c463d;font-family:inherit;font-size:11px;border-radius:11px;padding:3px 8px;margin:0 4px 4px 0;cursor:pointer}
.company-mini:hover{background:#e0ebe2}
.company-mini i{font-style:normal;color:#7d8a82;margin-left:3px;font-size:10px}
.ta-comps{max-width:230px}.ta-tp{max-width:260px}
.ta-last{max-width:220px}.ta-last small{color:var(--muted);margin-right:4px}.ta-last a{color:#386453;text-decoration:none}.ta-last a:hover{text-decoration:underline}
.mini-badge{display:inline-block;background:#eef1ec;color:#45534c;border-radius:10px;padding:2px 8px;font-size:10px;white-space:nowrap}
.mini-badge.up{background:#e3f3e7;color:#286342}.mini-badge.down{background:#f8e9e6;color:#a43c31}
.tone-badge{display:inline-flex;gap:5px;align-items:center;border-radius:10px;padding:2px 8px;font-size:10px;background:#eef4ef}
.tone-badge.t-strong{background:#dff1e5;color:#1f6b43}.tone-badge.t-pos{background:#e8f2ec;color:#33604e}.tone-badge.t-dry{background:#eef1ec;color:#5b665f}.tone-badge.t-cau{background:#fbf3dd;color:#8a661c}.tone-badge.t-neg{background:#f8e9e6;color:#a43c31}
.tone-modal{position:fixed;inset:0;background:rgba(15,24,20,.55);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:4vh 18px;overflow-y:auto}
.tone-modal[hidden]{display:none}
.tone-modal-box{position:relative;background:#fff;border:1px solid var(--line);width:min(860px,100%);max-height:92vh;overflow-y:auto;padding:22px 26px;box-shadow:0 18px 50px rgba(10,20,15,.35)}
.tone-modal-close{position:sticky;top:0;float:right;border:0;background:#12261f;color:#fff;width:30px;height:30px;border-radius:50%;font-size:17px;cursor:pointer;z-index:2}
.modal-ind{float:right;margin:2px 46px 0 0;border:1px solid #cfdcd2;background:#eef4ef;color:#2c5a45;border-radius:14px;padding:5px 12px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.modal-ind:hover{background:#dfeee3}
.modal-back{border:1px solid var(--line);background:#f2f6f2;color:#2c463d;border-radius:14px;padding:5px 12px;font-family:inherit;font-size:12px;cursor:pointer;margin-bottom:10px}.modal-back:hover{background:#e0ebe2}
.drill-header h3{margin:0;font-family:Georgia;font-weight:500;font-size:24px}
.drill-header h3 small{color:var(--muted);font-size:13px}
.drill-meta{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 4px}
.drill-charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0;border:1px solid var(--line);padding:14px}
.drill-charts h4{margin:0 0 8px;font-size:11px;color:#5b665f;letter-spacing:.05em}
.tone-chart{width:100%;height:auto}
.tone-chart .ax{font-size:15px;fill:#5b665f;font-weight:600}
.conv-notes{margin-top:6px;border-top:1px dashed #e0e6e0;padding-top:5px}
.conv-note{display:flex;gap:7px;align-items:baseline;font-size:10.5px;color:#5b665f;line-height:1.5;margin:2px 0}
.conv-note small{color:var(--muted);white-space:nowrap}
.conv-note b{color:#3c6b58;font-size:9px;letter-spacing:1px;white-space:nowrap}
.conv-note span{overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;line-clamp:1}
.street{margin:14px 0;border:1px solid #b9cde0;border-left:4px solid #3d6c9e;padding:12px 14px;background:#f3f7fc}
.street-head{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:7px}
.street h4{margin:0;font-size:12.5px;color:#2d5480;letter-spacing:.04em;font-weight:700;white-space:nowrap}
.street h4 small{font-weight:400;color:#7a8ba0;font-size:10.5px}
.street-stat{font-size:12px;margin-bottom:0}
.street-stat u{text-decoration:none;font-weight:700;padding:1px 7px;border-radius:9px;font-size:11px}
.street-stat u.up{color:#1f6b43;background:#eaf5ee}.street-stat u.down{color:#a43c31;background:#f9ecea}
.street-list{max-height:190px;overflow-y:auto;border-top:1px solid #d9e4f0}
.street-row{display:flex;gap:9px;align-items:baseline;padding:6px 4px;border-bottom:1px solid #e4edf6;font-size:12px;text-decoration:none;color:inherit}
.street-row:hover{background:#e9f1f9}
.street-row small{color:var(--muted);white-space:nowrap}
.street-row b{white-space:nowrap;min-width:64px}
.street-row .st-tp{font-weight:700;white-space:nowrap}
.street-row .st-tp.up{color:#2e7d4f}.street-row .st-tp.down{color:var(--red)}
.street-row i{font-style:normal;color:#5b665f;white-space:nowrap;font-size:11px}
.street-row{flex-wrap:wrap}
.street-row em{font-style:italic;color:#3a5346;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:11px;font-weight:600}
.street-row .st-points{flex-basis:100%;color:var(--muted);font-size:10.5px;line-height:1.5;padding-left:52px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
.drill-list{margin-top:6px}
.wk-bar{text-align:right;margin:6px 0 2px}
.wk-bar button{border:1px solid var(--line);background:#f2f5f1;color:#45534c;border-radius:12px;padding:4px 11px;font-size:11px;cursor:pointer;font-family:inherit}
.wk-bar button:hover{background:#e6ece6}
.drill-weekly{border-top:1px solid #e8ece6}
.drill-weekly>summary{cursor:pointer;list-style:none;display:flex;gap:9px;align-items:baseline;padding:9px 2px;font-size:12px}
.drill-weekly>summary::-webkit-details-marker{display:none}
.drill-weekly>summary::before{content:'▸';color:#8a938d;font-size:11px}
.drill-weekly[open]>summary::before{content:'▾'}
.drill-weekly>summary small{color:var(--muted);font-weight:700;white-space:nowrap}
.drill-weekly>summary em{font-style:normal;font-size:10px;font-weight:700;color:#5b665f;background:#eef1ec;border-radius:9px;padding:1px 7px;white-space:nowrap}
.drill-weekly>summary span{color:#45534c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.drill-weekly .drill-report{border-top:0;padding-top:2px}
.drill-report{border-top:1px solid #e8ece6;padding:13px 2px}
.drill-head{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.drill-head small{color:var(--muted);font-weight:700}
.drill-title{display:block;color:var(--ink);font-weight:600;text-decoration:none;line-height:1.5}
.drill-title:hover{color:#386453}
.drill-oneline{margin:5px 0;color:#55645c;font-size:12px;font-style:italic}
.drill-tp{margin:7px 0;border-left:3px solid #8a5a2b;background:#faf8f2;padding:7px 10px;font-size:12px;font-weight:600}
.drill-tp.up{border-left-color:#2e7d4f}.drill-tp.down{border-left-color:var(--red)}
.drill-tp small{display:block;font-weight:400;color:var(--muted);margin-top:4px;font-size:11px}
.est-comp{margin:7px 0;border-left:3px solid #3d6c9e;background:#eef3f8;padding:8px 11px;font-size:12px}
.est-comp>b{display:block;font-size:10px;letter-spacing:.05em;color:#2d5480;margin-bottom:4px}
.est-comp small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.est-line{margin:3px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
.est-line em{font-style:normal;font-weight:700;color:#2d5480;min-width:44px}
.est-item b{font-weight:700}
.est-item i{font-style:normal;font-weight:700}
.est-item i.up{color:#2e7d4f}.est-item i.down{color:var(--red)}
.drill-points{margin:6px 0;display:flex;gap:5px;flex-wrap:wrap}
.pt-chip{background:#eef4ef;color:#33604e;border-radius:10px;padding:2px 9px;font-size:11px}
.pt-chip.new{background:#dff1e5;color:#1f6b43;font-weight:700}
.pt-prev{color:#96a09a;font-size:10.5px;font-style:italic;align-self:center;padding-left:2px}
.phrase-details{margin:7px 0;font-size:12px}
.phrase-details summary{cursor:pointer;color:#386453;font-size:11px;font-weight:700}
.phrase{margin:7px 0;padding:7px 10px;font-size:12px;line-height:1.7}
.phrase b{display:block;font-size:10px;letter-spacing:.05em;margin-bottom:3px}
.phrase q{display:block}
.ph-strong{background:#eaf5ee}.ph-strong b{color:#1f6b43}
.ph-hedge{background:#fbf5e3}.ph-hedge b{color:#8a661c}
.ph-neg{background:#f9ecea}.ph-neg b{color:#a43c31}
.drill-foot{display:flex;gap:16px;align-items:flex-start;margin-top:4px}
.drill-foot .phrase-details{margin:3px 0;flex:1;min-width:0}
.drill-report-link{color:#386453;font-size:11px;font-weight:700;white-space:nowrap;text-decoration:none;padding-top:3px}
.drill-report-link:hover{text-decoration:underline}
@media(max-width:950px){.tone-toolbar{grid-template-columns:1fr 1fr}.tone-toolbar input{grid-column:1/3}.drill-charts{grid-template-columns:1fr}.tone-event-cols{grid-template-columns:1fr}.tone-event-col+.tone-event-col{border-left:0;border-top:1px solid var(--line)}}
@media(max-width:620px){.tone-toolbar{grid-template-columns:1fr}.tone-toolbar input{grid-column:auto}.tone-modal{padding:8px}.tone-modal-box{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div><h1>애널리스트 톤 보드</h1></div>
    <div class="links">
      <a href="https://github.com/gschoie/DAOL-RESEARCH-TONE/actions/workflows/refresh-tone.yml" target="_blank" rel="noopener">🔄 데이터 갱신 (Actions)</a>
      <a href="https://t.me/s/daolresearch" target="_blank" rel="noopener">✈ 다올리서치 채널</a>
    </div>
  </header>
  <div class="tone-toolbar">
    <input id="tone-search" placeholder="키워드 검색 — 제목·투자포인트·문구·기업·애널 (예: KDDX, HBM, 유리기판)">
    <select id="tone-sector"><option value="">전체 섹터</option></select>
    <select id="tone-analyst"><option value="">전체 애널리스트</option></select>
    <button id="tone-refresh" type="button">새로고침</button>
    <button id="street-lookup-btn" type="button" title="다올 커버 여부와 무관하게, 한경 에이셀에 취합된 전시장 리포트를 종목명으로 조회">🔍 전시장 조회</button>
    <span id="tone-status">불러오는 중…</span>
  </div>
  <div id="tone-events"></div>
  <div id="tone-content"><div class="tone-loading">DAOL 리서치 톤 데이터를 읽고 있습니다.</div></div>
  <div id="tone-modal" class="tone-modal" hidden><div class="tone-modal-box"><button id="tone-modal-close" class="tone-modal-close" type="button" aria-label="닫기">×</button><div id="tone-modal-body"></div></div></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={tone2:null,toneQ:'',toneSector:'',toneAnalyst:'',sectorSort:'recent',rowSort:null};
const convDots=v=>v==null?'':`<span class="conv-dots" title="확신도 ${v}/5">${'●'.repeat(v)}${'○'.repeat(5-v)}</span>`;

const mmdd=s=>String(s||'').slice(5).replace('-','.');
function sparkline(series,w=110,h=26){const pts=(series||[]).filter(x=>x.v!=null);if(pts.length<2)return '<span class="tone-empty">—</span>';const xs=i=>4+i*(w-8)/(pts.length-1),ys=v=>h-4-(v-1)*(h-8)/4;const line=pts.map((p,i)=>`${xs(i).toFixed(1)},${ys(p.v).toFixed(1)}`).join(' ');const last=pts[pts.length-1];return `<svg class="conv-spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${line}" fill="none" stroke="#3c6b58" stroke-width="1.6"/><circle cx="${xs(pts.length-1).toFixed(1)}" cy="${ys(last.v).toFixed(1)}" r="2.6" fill="#173f35"/><title>${pts.map(p=>`${mmdd(p.date)} ${p.v} (${esc(p.company)})`).join('\n')}</title></svg>`}
function tpChip(x,withCompany=true){const dir=x.direction||'',cls=dir==='상향'?'up':dir==='하향'?'down':'';const reasons=(x.reasons||[]).map(r=>`<i class="tp-reason">${esc(r)}</i>`).join('');return `<button type="button" class="tp-chip ${cls} tone-ck" data-ck="${esc(x.company_key||'')}" title="${esc(x.evidence||'')}">${withCompany?`<b>${esc(x.company)}</b> `:''}${dir==='상향'?'▲':dir==='하향'?'▼':'●'} ${esc(x.display||dir)}${reasons}</button>`}
const evShort=t=>({'TP 상향':'TP▲','TP 하향':'TP▼','실적추정 상향':'실적▲','실적추정 하향':'실적▼','의견 변경':'의견','투자포인트 변화':'포인트','톤 급변↑':'톤↑','톤 급변↓':'톤↓','톤 이례↑':'이례↑','톤 이례↓':'이례↓'})[t]||t;

 const events=(state.tone2?.events||[]).filter(flt),steady=(state.tone2?.steady||[]).filter(flt);

   if(hay.includes(q))out.push({key:c.key,name:c.name,r})}}

function renderTone(){const data=state.tone2||{sectors:[]},q=state.toneQ.trim().toLocaleLowerCase();

function fillToneFilters(){const sectors=(state.tone2?.sectors||[]).map(x=>x.sector),analysts=[...new Set((state.tone2?.sectors||[]).flatMap(g=>g.analysts.map(a=>a.analyst)))].sort((a,b)=>a.localeCompare(b,'ko'));$('#tone-sector').innerHTML='<option value="">전체 섹터</option>'+sectors.map(x=>`<option ${state.toneSector===x?'selected':''}>${esc(x)}</option>`).join('');$('#tone-analyst').innerHTML='<option value="">전체 애널리스트</option>'+analysts.map(x=>`<option ${state.toneAnalyst===x?'selected':''}>${esc(x)}</option>`).join('')}
function lineChart(points,{w=560,h=150,color='#8a5a2b',fmt=v=>Number(v).toLocaleString()}={}){const pts=points.filter(p=>p.v!=null);if(pts.length<2)return '<div class="tone-empty">표시할 데이터가 2건 미만입니다.</div>';const vs=pts.map(p=>p.v),min=Math.min(...vs),max=Math.max(...vs),pad=(max-min)*0.12||max*0.05||1;const lo=min-pad,hi=max+pad;const xs=i=>64+i*(w-78)/(pts.length-1),ys=v=>h-24-(v-lo)*(h-38)/(hi-lo);const line=pts.map((p,i)=>`${xs(i).toFixed(1)},${ys(p.v).toFixed(1)}`).join(' ');const dots=pts.map((p,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(p.v).toFixed(1)}" r="${p.c?3.5:3}" fill="${p.c||color}"><title>${mmdd(p.date)} · ${fmt(p.v)}${p.note?` · ${esc(p.note)}`:''}</title></circle>`).join('');return `<svg class="tone-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet"><text x="4" y="${ys(max)+4}" class="ax">${fmt(max)}</text><text x="4" y="${ys(min)+4}" class="ax">${fmt(min)}</text><text x="64" y="${h-6}" class="ax">${mmdd(pts[0].date)}</text><text x="${w-14}" y="${h-6}" class="ax" text-anchor="end">${mmdd(pts[pts.length-1].date)}</text><polyline points="${line}" fill="none" stroke="${color}" stroke-width="2"/>${dots}</svg>`}
const fmtNum=v=>v==null?'—':Number(v).toLocaleString(undefined,{maximumFractionDigits:0});
function estPair(name,p,unit){if(!p)return '';const d=p.diff_pct;return `<span class="est-item">${name} <b>${fmtNum(p.our)}${p.our!=null?unit:''}</b> vs 컨센 ${fmtNum(p.cons)}${p.cons!=null?unit:''}${d!=null?` <i class="${d>=0?'up':'down'}">${d>0?'+':''}${d}%</i>`:''}</span>`}

 const prevPts=(r.points_dropped||[]).length?`<span class="pt-prev" title="직전 리포트의 핵심 키워드 — 이번 자료에서는 강조되지 않음(소멸이 아니라 키워드 변경)">직전: ${r.points_dropped.map(esc).join(' · ')}</span>`:'';
 const points=curPts+prevPts;
 const phrases=r.ai&&(r.strong_phrases?.length||r.hedge_phrases?.length||r.negative_phrases?.length)?`<details class="phrase-details"><summary>근거 문구 보기</summary>${phraseBlock('강한 문구',r.strong_phrases,'ph-strong')}${phraseBlock('헤징 문구',r.hedge_phrases,'ph-hedge')}${phraseBlock('부정 문구',r.negative_phrases,'ph-neg')}</details>`:'';
 return `<div class="drill-report"><div class="drill-head"><small>${esc(r.date)}</small><span class="mini-badge">${esc(r.analyst)}</span>${r.opinion?`<span class="op-badge ${opinionClass(r.opinion)}">${esc(r.opinion)}</span>`:''}${r.ai?`<span class="tone-badge ${toneLabelClass(r.tone_label)}">${convDots(r.conviction)} ${esc(r.tone_label)}</span>${r.conv_base?`<span class="mini-badge" title="이 애널리스트의 평소 확신도 평균">평소 ${r.conv_base}</span>`:''}`:r.bundled?'<span class="mini-badge" title="산업 인뎁스 자료의 종목 페이지에서 추출한 TP">인뎁스 수록</span>':'<span class="mini-badge" title="AI 분석 전 — 정규식 추출만 반영">AI 대기</span>'}${earnings}${streetConflicts(r,street)}</div><a class="drill-title" href="${esc(r.post_url)}" target="_blank" rel="noopener">${esc(r.title)}</a>${r.one_line?`<p class="drill-oneline">${esc(r.one_line)}</p>`:''}${tp}${estCompBlock(r)}${points?`<div class="drill-points">${points}</div>`:''}<div class="drill-foot">${phrases||'<span></span>'}<a class="drill-report-link" href="${esc(r.pdf_url)}" target="_blank" rel="noopener">보고서 ↗</a></div></div>`}
let kedAll=null;
async function loadKedAll(){if(kedAll)return kedAll;
 try{const r=await fetch(`ked_street.json?t=${Date.now()}`,{cache:'no-store'});if(r.ok)kedAll=await r.json()}catch{}
 return kedAll||[]}
function kedStats(items){const tps=items.map(e=>e.tp_new).filter(Boolean).sort((a,b)=>a-b);
 if(!tps.length)return '';
 return `타사 TP ${fmtNum(tps[0])}~${fmtNum(tps[tps.length-1])}원 · 중앙 ${fmtNum(tps[Math.floor(tps.length/2)])}원 (n=${items.length})`}
function renderStreetLookup(q){const box=$('#street-lookup-results');if(!box)return;
 const query=(q||'').trim().toLocaleLowerCase().replace(/\s+/g,'');
 if(query.length<1){box.innerHTML='<div class="tone-empty" style="padding:14px">종목명을 입력하세요 — 다올 커버 여부와 무관하게 최근 120일 전시장 리포트를 조회합니다.</div>';return}
 const byCompany=new Map();
 for(const e of (kedAll||[])){const k=e.company.toLocaleLowerCase().replace(/\s+/g,'');
  if(!k.includes(query))continue;
  if(!byCompany.has(e.company))byCompany.set(e.company,[]);
  byCompany.get(e.company).push(e)}
 if(!byCompany.size){box.innerHTML='<div class="tone-empty" style="padding:14px">에이셀 수집분(120일)에 해당 종목 리포트가 없습니다.</div>';return}
 let html='';let shown=0;
 for(const [name,items] of [...byCompany.entries()].sort((a,b)=>b[1].length-a[1].length)){
  if(++shown>20)break;
  items.sort((a,b)=>b.date.localeCompare(a.date));
  // 다올 커버 종목이면 드릴다운으로 연결
  const daol=Object.values(state.tone2?.companies||{}).find(c=>!c.key.startsWith('IND:')&&c.name===name);
  html+=`<div class="lookup-company"><div class="lookup-head"><b>${esc(name)}</b><small>${kedStats(items)}</small>${daol?`<button type="button" class="tone-ck company-mini" data-ck="${esc(daol.key)}">다올 뷰 →</button>`:''}</div>${items.slice(0,6).map(streetRow).join('')}</div>`}
 box.innerHTML=html}
async function openStreetLookup(){
 $('#tone-modal-body').innerHTML=`<header class="drill-header"><h3>전시장 종목 조회 <small>한경 에이셀 · 최근 120일</small></h3></header>
  <input id="street-lookup-input" class="lookup-input" placeholder="종목명 입력 (예: 대덕전자, 한온시스템…)" autocomplete="off">
  <div id="street-lookup-results"><div class="tone-empty" style="padding:14px">데이터 로딩 중…</div></div>`;
 $('#tone-modal').hidden=false;document.body.style.overflow='hidden';
 modalStack=[];currentModalKey='__lookup__';
 await loadKedAll();
 renderStreetLookup($('#street-lookup-input').value);
 const inp=$('#street-lookup-input');inp.focus();
 inp.oninput=e=>renderStreetLookup(e.target.value)}
let modalStack=[],currentModalKey=null;
function openToneCompany(key,fromBack=false){const entry=state.tone2?.companies?.[key];if(!entry)return;
 if(!fromBack&&currentModalKey&&currentModalKey!==key)modalStack.push(currentModalKey);
 currentModalKey=key;
 const timeline=[...entry.timeline];
 const tpPoints=[];
 for(const r of timeline){const t=r.tp_event;if(!t||!t.value)continue;
  // 상향/하향은 직전값을 같은 날짜에 먼저 찍어 실제 꺾임이 보이게 한다
  if(t.prior&&t.prior!==t.value)tpPoints.push({date:r.date,v:t.prior,note:'변경 전'});
  tpPoints.push({date:r.date,v:t.value,note:t.direction,c:t.direction==='하향'?'#bd4335':t.direction==='상향'?'#2e7d4f':null})}
 const convPoints=timeline.filter(r=>r.conviction!=null).map(r=>({date:r.date,v:r.conviction,note:r.tone_label}));
 let leftPanel=`<div><h4>적정주가(TP) 추이</h4>${lineChart(tpPoints)}</div>`;
 if(key.startsWith('IND:')){
  // 산업 모달: 최선호주(가장 최근 명시) → 커버 종목 TP 현황 순으로 보여준다.
  const pickRec=[...timeline].reverse().find(r=>(r.top_picks||[]).length);
  const picks=pickRec?`<div class="top-picks"><b>최선호주 / TOP PICK <small>${mmdd(pickRec.date)} 자료 기준</small></b>${pickRec.top_picks.map(t=>`<p>${esc(t)}</p>`).join('')}</div>`:'';
  const comps=Object.values(state.tone2?.companies||{}).filter(c=>!c.key.startsWith('IND:')&&c.sector===entry.sector);
  const rows=comps.map(c=>{const t=[...c.timeline].reverse().find(r=>r.tp_event&&r.tp_event.value);return t?{c,r:t,tp:t.tp_event}:null}).filter(Boolean)
   .sort((a,b)=>b.r.date.localeCompare(a.r.date));
  leftPanel=`<div>${picks}<h4>커버 종목 TP 현황 <small style="font-weight:400;color:var(--muted)">최근 변동순</small></h4>${rows.length?`<div class="cov-tp">${rows.map(x=>`<button type="button" class="cov-row tone-ck" data-ck="${esc(x.c.key)}"><b>${esc(x.c.name)}</b><span class="cov-val ${x.tp.direction==='상향'?'up':x.tp.direction==='하향'?'down':''}">${x.tp.direction==='상향'?'▲':x.tp.direction==='하향'?'▼':'●'} ${esc(x.tp.display)}</span><small>${mmdd(x.r.date)}${(x.tp.reasons||[]).length?` · ${x.tp.reasons.join('·')}`:''}</small></button>`).join('')}</div>`:'<div class="tone-empty">TP 표기 종목 없음</div>'}</div>`;
 }
 // 확신도 점수의 '이유' — 최근 3건의 AI 한줄 요약을 차트 밑에 살짝
 const convNotes=timeline.filter(r=>r.conviction!=null&&r.one_line).slice(-3).reverse()
  .map(r=>`<div class="conv-note"><small>${mmdd(r.date)}</small><b>${'●'.repeat(r.conviction)}</b><span>${esc(r.one_line)}</span></div>`).join('');
 const charts=`<div class="drill-charts">${leftPanel}<div><h4>AI 확신도 추이 (1~5)</h4>${lineChart(convPoints,{color:'#3c6b58',fmt:v=>v})}${convNotes?`<div class="conv-notes">${convNotes}</div>`:''}</div></div>`;
 const indBtn=(!key.startsWith('IND:')&&entry.sector&&state.tone2?.companies?.['IND:'+entry.sector])?`<button type="button" class="tone-ck modal-ind" data-ck="IND:${esc(entry.sector)}" title="${esc(entry.sector)} 산업자료 톤·의견 보기">${esc(entry.sector)} 산업 뷰 →</button>`:'';
 $('#tone-modal-body').innerHTML=`${indBtn}${modalStack.length?`<button type="button" id="tone-modal-back" class="modal-back">← ${esc((state.tone2?.companies?.[modalStack[modalStack.length-1]]||{}).name||'뒤로')}</button>`:''}<header class="drill-header"><h3>${esc(entry.name)}${entry.code?` <small>(${esc(entry.code)})</small>`:''}</h3><div class="drill-meta"><span class="mini-badge">${esc(entry.sector)}</span><span class="mini-badge">${(entry.analysts||[]).map(esc).join(' · ')}</span><span class="mini-badge">${entry.report_count}건 · ${esc(entry.timeline[0]?.date||'')} ~ ${esc(entry.last_date||'')}</span></div></header>${charts}${(()=>{const rev=timeline.slice().reverse();
  // 산업 모달(전략·시황 제외)의 위클리는 접이식 — 최신 1건만 펼침
  const collapsible=key.startsWith('IND:')&&entry.sector!=='전략·시황';
  const isWk=r=>/Weekly|위클리|주간\s*(모니터링|동향)/i.test(r.title||'');
  const renderRec=r=>{
   if(collapsible&&isWk(r)){
    // 산업 모달의 기본은 인뎁스·산업분석 중심 — 위클리는 전부 접힌 상태로 시작
    return `<details class="drill-weekly"><summary><small>${mmdd(r.date)}</small><em>위클리</em>${r.conviction!=null?convDots(r.conviction):''}<span>${esc((((r.title||'').replace(/^\[[^\]]*\]\s*/,''))||r.one_line||'').slice(0,64))}</span></summary>${drillReport(r,entry.street)}</details>`}
   return drillReport(r,entry.street)};
  const wkBar=collapsible&&rev.some(isWk)?`<div class="wk-bar"><button type="button" id="wk-toggle">위클리 모두 접기 / 펼치기</button></div>`:'';
  const first=rev.length?`<div class="drill-list">${renderRec(rev[0])}</div>`:'';
  const street=key.startsWith('IND:')?'':streetPanel(entry);
  const rest=rev.length>1?`<div class="drill-list">${rev.slice(1).map(renderRec).join('')}</div>`:'';
  return wkBar+first+street+rest})()}`;
 $('#tone-modal').hidden=false;document.body.style.overflow='hidden'}
function closeToneModal(){$('#tone-modal').hidden=true;document.body.style.overflow='';modalStack=[];currentModalKey=null}
async function loadTone(){$('#tone-status').textContent='불러오는 중…';
 try{const r=await fetch(`daol_tone_v2.json?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(r.status);state.tone2=await r.json()}
 catch(e){$('#tone-content').innerHTML=`<div class="tone-loading">데이터를 불러오지 못했습니다 (${esc(e.message)}). 잠시 후 새로고침해 주세요.</div>`;$('#tone-status').textContent='로드 실패';return}
 fillToneFilters();renderTone();
 const t=state.tone2,stamp=t.generated_at?new Intl.DateTimeFormat('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(t.generated_at)):'';
 $('#tone-status').textContent=`${stamp} · ${(t.report_count||0).toLocaleString()}건 · AI ${(t.ai_analyzed||0).toLocaleString()}건`}
$('#tone-search').oninput=e=>{state.toneQ=e.target.value;renderTone()};
$('#tone-sector').onchange=e=>{state.toneSector=e.target.value;renderTone()};
$('#tone-analyst').onchange=e=>{state.toneAnalyst=e.target.value;renderTone()};
$('#tone-refresh').onclick=loadTone;
$('#street-lookup-btn').onclick=openStreetLookup;
$('#tone-modal-close').addEventListener('click',closeToneModal);
$('#tone-modal').addEventListener('click',e=>{if(e.target.id==='tone-modal')closeToneModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#tone-modal').hidden)closeToneModal()});
document.addEventListener('click',e=>{
 if(e.target.closest('#wk-toggle')){const ds=[...document.querySelectorAll('#tone-modal-body details.drill-weekly')];const anyOpen=ds.some(d=>d.open);ds.forEach(d=>d.open=!anyOpen);return}
 if(e.target.closest('#tone-modal-back')){const k=modalStack.pop();if(k)openToneCompany(k,true);return}
 const t=e.target.closest('.tone-ck');if(t&&t.dataset.ck){openToneCompany(t.dataset.ck);return}
 if(e.target.closest('#th-sector')){if(state.rowSort){state.rowSort=null}else{state.sectorSort={recent:'asc',asc:'desc',desc:'recent'}[state.sectorSort]}renderTone();return}
 const th=e.target.closest('#th-analyst,#th-opinion,#th-tone');
 if(th){const key={'th-analyst':'analyst','th-opinion':'opinion','th-tone':'tone'}[th.id];
  const rs=state.rowSort;
  state.rowSort=(!rs||rs.key!==key)?{key,dir:key==='analyst'?1:-1}:(rs.dir===(key==='analyst'?1:-1)?{key,dir:-rs.dir}:null);
  renderTone()}});
// 대시보드 iframe 안에서는 제목 블록을 숨긴다(대시보드 상단 타이틀과 중복) — 링크만 우측에 유지
if(window.self!==window.top){const hero=document.querySelector('.hero');if(hero){hero.querySelector('div:first-child').style.display='none';hero.style.cssText+='border-bottom:0;padding-bottom:2px;margin-bottom:6px;justify-content:flex-end'}}
loadTone();
</script>
